<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mewo2/terrain 程序化大陆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { font-family: 'Georgia', 'Songti SC', serif; background: #3d2f24; color: #e8dcc0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; color: #f0e0c0; margin-bottom: 6px; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 12px; color: #b8a488; margin-bottom: 16px; line-height: 1.7; }
  .sub b { color: #d8c090; }
  .controls { display: flex; flex-direction: column; gap: 8px; justify-content: center; align-items: center; margin-bottom: 14px; background: #4a3a2c; border-radius: 10px; padding: 10px 14px; }
  .controls .ctrl-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  .controls label { font-size: 13px; color: #d8c8a8; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .controls select, .controls input { background: #5a4836; color: #f0e4c8; border: 1px solid #8a6f52; border-radius: 6px; padding: 5px 8px; font-size: 13px; font-family: inherit; flex-shrink: 0; white-space: nowrap; }
  .controls button { background: #8a5a2a; color: #fff6e6; border: none; border-radius: 8px; padding: 7px 18px; font-size: 14px; cursor: pointer; font-family: inherit; letter-spacing: 1px; flex-shrink: 0; white-space: nowrap; }
  .controls button:hover { background: #a06a30; }
  #status { font-size: 12px; color: #c8b898; text-align: center; margin-bottom: 10px; min-height: 16px; }
  .mapbox { background: #f5ecd7; border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.45); position: relative; overflow: auto; width: fit-content; margin: 0 auto; }
  .map-wrap { position: relative; width: fit-content; margin: 0 auto; }
  .mapbox.fullscreen { position: fixed; inset: 0; width: 100%; z-index: 9999; border-radius: 0; padding: 12px; background: #241b12; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .mapbox.fullscreen svg#map { max-width: 96vw; max-height: 94vh; }
  .map-tools { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; max-width: 470px; overflow: hidden; transition: max-width .35s ease; }
  .map-tools.collapsed { max-width: 32px; }
  .map-tools .tool-group { display: flex; gap: 5px; align-items: center; padding-right: 32px; opacity: 1; transition: opacity .25s ease; }
  .map-tools.collapsed .tool-group { opacity: 0; pointer-events: none; }
  .map-tools button { background:#5a4836; color:#f0e4c8; border:1px solid #8a6f52; border-radius:6px; cursor:pointer; padding:4px 10px; font-size:13px; font-family:inherit; flex-shrink: 0; white-space: nowrap; }
  .map-tools button:hover { background:#6a5540; }
  /* 折叠按钮绝对定位于右侧，不参与 flex 收缩，折叠时永远可见 */
  .map-tools .fold-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); z-index: 2; flex-shrink: 0; min-width: 24px; padding: 4px 6px; text-align: center; }
  /* 图层显隐开关：隐藏时按钮高亮（橙色）表示该层当前被隐藏 */
  .map-tools .sep { width: 1px; height: 20px; align-self: center; background: #8a6f52; margin: 0 2px; flex-shrink: 0; }
  .map-tools button.layer-btn.active { background: #c0762e; color: #fff6e6; border-color: #e8b070; }
  .map-tools button.layer-btn.active:hover { background: #d0863e; }
  /* 被隐藏的图层：标记与文字一律不显示 */
  svg#map .layer-hidden { display: none; }
  svg#map { cursor: grab; touch-action: none; display: block; width: 100%; height: auto; background: #f5ecd7; border-radius: 8px; }
  svg#map.dragging { cursor: grabbing; }
  /* 羊皮纸风样式（mewo2/terrain 原版风格） */
  path.river { fill: none; stroke: #7fa8c9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  path.coast { fill: none; stroke: #8a6a4a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  path.border { fill: none; stroke: #a08060; stroke-width: 1.6; stroke-dasharray: 12 4 2 4; opacity: .75; }
  path.road { fill: none; stroke: #4a2f16; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  path.roadsea { fill: none; stroke: #4a2f16; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 4; opacity: .6; }
  line.slope { stroke: #9a7b52; opacity: .7; }
  circle.city { fill: #fdf6e3; stroke: #4a3018; stroke-width: 3; }
  text.city { font-family: Georgia, serif; fill: #3a2a18; font-size: 20px; font-weight: bold; paint-order: stroke; stroke: #f5ecd7; stroke-width: 3px; stroke-linejoin: round; }
  text.region { font-family: Georgia, serif; fill: #6a4a28; font-size: 36px; font-style: italic; letter-spacing: 3px; paint-order: stroke; stroke: #f5ecd7; stroke-width: 4px; stroke-linejoin: round; opacity: .85; }
  text.city.fantasy, text.region.fantasy { font-family: "KaiTi","STKaiti","SimSun",serif; }
  button.seed-rnd { height: 30px; line-height: 28px; padding: 0 9px; background:#5a4836; color:#f0e4c8; border:1px solid #8a6f52; border-radius:6px; cursor:pointer; font-size:13px; }
  button.seed-rnd:hover { background:#6a5540; }
  /* 侧边栏（地图工具：导出 + 名称管理三级关联） */
  #sidePanel { position: fixed; top: 16px; right: 16px; width: 320px; max-height: 92vh; display: flex; flex-direction: column; background: #4a3a2c; border: 1px solid #8a6f52; border-radius: 10px; color: #e8dcc0; font-family: 'Georgia','Songti SC',serif; z-index: 100; box-shadow: 0 6px 24px rgba(0,0,0,.5); overflow: hidden; }
  #sidePanel.closed { width: 34px; }
  #sidePanel.closed .sp-body, #sidePanel.closed .sp-title { display: none; }
  #sidePanel .sp-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #6a5540; }
  #sidePanel .sp-title { font-size: 14px; font-weight: bold; color: #f0e0c0; letter-spacing: 1px; }
  #sidePanel .sp-fold { background: none; border: none; color: #c8b898; font-size: 14px; cursor: pointer; padding: 0 4px; }
  #sidePanel .sp-fold:hover { color: #f0e0c0; }
  #sidePanel .sp-body { padding: 10px 12px; overflow-y: auto; }
  #sidePanel .sp-export { width: 100%; margin-bottom: 4px; padding: 7px; background: #8a5a2a; color: #fff6e6; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-family: inherit; }
  #sidePanel .sp-export:hover { background: #a06a30; }
  #sidePanel .sp-export.small { padding: 5px; font-size: 12px; background: #5a4836; color: #f0e4c8; border: 1px solid #8a6f52; }
  #sidePanel .sp-export.small:hover { background: #6a5540; }
  /* 新增城市：按钮高亮态 + 地图右下角坐标浮层 */
  #sidePanel .sp-export.small.active { background: #c0762e; color: #fff6e6; border-color: #e8b070; }
  #sidePanel .sp-export.small.active:hover { background: #d0863e; }
  .map-coords { position: absolute; right: 8px; bottom: 8px; z-index: 12; display: none; background: rgba(74,58,44,.92); color: #f0e4c8; font-size: 12px; font-family: Consolas, monospace; padding: 3px 9px; border-radius: 6px; border: 1px solid #8a6f52; pointer-events: none; white-space: nowrap; }
  .map-coords.show { display: block; }
  #sidePanel .sp-sec { font-size: 12px; color: #e8c890; margin: 10px 0 6px; letter-spacing: 1px; border-bottom: 1px solid #6a5540; padding-bottom: 3px; }
  #sidePanel .sp-empty { font-size: 12px; color: #b8a488; padding: 6px 0; }
  /* 三级树 */
  #sidePanel .sp-node { display: flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
  #sidePanel .sp-node:hover { background: #5a4836; }
  #sidePanel .sp-node.hl-node { background: #c0762e; color: #fff6e6; }
  #sidePanel .sp-node .sp-caret { width: 12px; text-align: center; flex-shrink: 0; color: #c8b898; }
  #sidePanel .sp-node .sp-count { margin-left: auto; font-size: 10px; color: #b8a488; flex-shrink: 0; }
  #sidePanel .sp-children { padding-left: 14px; }
  #sidePanel .sp-node.sp-region { font-weight: bold; color: #f0e0c0; }
  #sidePanel .sp-node.sp-city { color: #e8dcc0; }
  #sidePanel .sp-node .sp-edit { background: #5a4836; color: #f0e4c8; border: 1px solid #8a6f52; border-radius: 4px; font-size: 10px; padding: 1px 5px; cursor: pointer; font-family: inherit; flex-shrink: 0; display: none; }
  #sidePanel .sp-node:hover .sp-edit { display: inline-block; }
  #sidePanel .sp-node .sp-edit:hover { background: #6a5540; }
  #sidePanel .sp-node .sp-edit.ok { background: #8a5a2a; display: inline-block; }
  #sidePanel .sp-node .sp-edit.no { background: #7a3a2a; display: inline-block; }
  #sidePanel .sp-node .sp-edit.del { background: #7a3a2a; }
  #sidePanel .sp-node .sp-edit.del:hover { background: #8a4a3a; }
  #sidePanel .sp-node input { flex: 1; min-width: 0; background: #5a4836; color: #f0e4c8; border: 1px solid #8a6f52; border-radius: 4px; padding: 2px 5px; font-size: 12px; font-family: inherit; }
  #sidePanel .sp-tip { font-size: 10px; color: #b8a488; margin-top: 8px; line-height: 1.5; }
  /* 地图联动高亮 */
  #map circle.city.hl { stroke: #d0762e; stroke-width: 6; }

</style>
</head>
<body>
<div class="wrap">
<h1>程序化大陆</h1>
<p class="sub">来源：<b>mewo2/terrain</b>（MIT · 2016 · 1073 行单文件）</p>
<div class="controls">
  <div class="ctrl-row">
    <label>细胞数
      <select id="npts">
        <option value="4096">4k（快）</option>
        <option value="8192">8k（中）</option>
        <option value="16384" selected>16k（默认）</option>
        <option value="32768">32k（高细节）</option>
        <option value="65536">64k（最高·重）</option>
      </select>
    </label>
    <label>领地数 <input id="nterrs" type="number" value="5" min="1" max="15" style="width:50px" title="领地（区域）数量，自动不超过城市数"></label>
    <label>城市数 <input id="ncities" type="number" value="15" min="4" max="40" style="width:60px"></label>
    <label>种子 <input id="seed" type="text" placeholder="留空 = 随机" style="width:130px"><button type="button" onclick="randomSeed()" title="随机种子" class="seed-rnd">↻</button></label>
  </div>
  <div class="ctrl-row">
    <label>世界规模
      <select id="resol" title="地图世界规模：面积按倍率²等比放大，组件尺寸不变，同屏可容纳更多领地（切换后点「生成地图」应用）">
        <option value="1" selected>1x（标准）</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </label>
    <label>词库 <select id="lexsel" onchange="setLex(this.value)"></select></label>
    <button id="genbtn" onclick="gen()">生成地图</button>
  </div>
</div>
<div id="status">点击「生成地图」开始</div>
<div class="mapbox">
  <div class="map-wrap">
    <div class="map-tools">
      <span class="tool-group">
        <button onclick="zoomBy(1.25)" title="缩小">−</button>
        <button onclick="zoomBy(0.8)" title="放大">+</button>
        <button onclick="resetView()" title="复位全貌">全貌</button>
        <button onclick="toggleFullscreen()" title="网页内全屏 / 还原" data-fs>全屏</button>
        <span class="sep"></span>
        <button class="layer-btn" data-layer="road" onclick="toggleLayer('road')" title="隐藏 / 显示道路（实线与海上虚线）">道路</button>
        <button class="layer-btn" data-layer="city" onclick="toggleLayer('city')" title="隐藏 / 显示城市（标记与名称）">城市</button>
        <button class="layer-btn" data-layer="terr" onclick="toggleLayer('terr')" title="隐藏 / 显示领地（边界与名称）">领地</button>
      </span>
      <button class="fold-btn" onclick="toggleTools()" title="折叠工具按钮">»</button>
    </div>
    <svg id="map" viewBox="-500 -500 1000 1000" width="960" height="960"></svg>
    <div class="map-coords" id="mapCoords"></div>
  </div>
</div>
</div>
<aside id="sidePanel">
  <div class="sp-head">
    <span class="sp-title">地图工具</span>
    <button class="sp-fold" onclick="toggleSide()" title="收起 / 展开侧栏">«</button>
  </div>
  <div class="sp-body">
    <button class="sp-export" onclick="exportPNG()" title="导出完整地图为 PNG（包含临时命名，不受缩放影响）">⬇ 导出图片</button>
    <button class="sp-export small" onclick="exportData()" title="导出当前地图数据为 txt（种子 / 细胞数 / 城市数 / 领地数 + 领地城市名称），可用任意文本编辑器修改后导入恢复">⤓ 导出数据</button>
    <button class="sp-export small" onclick="document.getElementById('importFile').click()" title="导入地图数据文件（txt）：自动用文件中的参数重新生成地图并恢复当时的名称">⤒ 导入数据</button>
    <input type="file" id="importFile" accept=".txt,text/plain" style="display:none" onchange="onImportFile(event)">
    <button class="sp-export small" id="addCityBtn" onclick="toggleAddCity()" title="新增模式：进入后鼠标移到地图上右下角显示坐标，点击地图放置新城市（自动命名 / 归属领地 / 连接道路），Esc 或再点退出">＋ 新增城市</button>
    <div class="sp-sec">名称管理 · 领地-城市</div>
    <div id="spTree"></div>
  </div>
</aside>
<script>
/* ============================================================
   原生替代库（替换原版内嵌的 d3 v4.13.0 全量 220KB + js-priority-queue）
   仅提供本演示页用到的 d3 API 子集，行为与 d3 v4 一致。
   体积：约 4KB；d3.voronoi 由下方 d3-voronoi@1.1.4 单库提供（9KB）。
   ============================================================ */
var d3 = window.d3 = window.d3 || {};
/* ---- 统计工具（等价 d3 v4 的 min/max/mean/quantile/scan/ascending/descending）---- */
function dmin(a) { var m = Infinity; for (var i = 0; i < a.length; i++) if (a[i] < m) m = a[i]; return m; }
function dmax(a) { var m = -Infinity; for (var i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m; }
function dmean(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
function dascending(a, b) { return a < b ? -1 : a > b ? 1 : a >= b ? 0 : NaN; }
function ddescending(a, b) { return b < a ? -1 : b > a ? 1 : b >= a ? 0 : NaN; }
function dquantileSorted(sorted, q) {
  var n = sorted.length;
  if (q <= 0 || n < 2) return sorted[0];
  if (q >= 1) return sorted[n - 1];
  var i = (n - 1) * q, i0 = Math.floor(i);
  return sorted[i0] + (sorted[i0 + 1] - sorted[i0]) * (i - i0);
}
function dscan(values, compare) {
  var n = values.length;
  if (!n) return undefined;
  compare = compare || dascending;
  var i = 0, j = 0, xi, xj = values[j];
  while (++i < n) {
    if (compare(xi = values[i], xj) < 0) { xj = xi; j = i; }
  }
  if (compare(xj, xj) !== 0) return undefined;
  return j;
}
d3.min = dmin; d3.max = dmax; d3.mean = dmean;
d3.ascending = dascending; d3.descending = ddescending;
d3.quantile = dquantileSorted; d3.scan = dscan;

/* ---- SVG path 构造器（等价 d3.path；数字按 JS 默认字符串拼接，与原版一致）---- */
function svgPath() {
  var cmds = [];
  return {
    moveTo: function (x, y) { cmds.push('M' + x + ',' + y); },
    lineTo: function (x, y) { cmds.push('L' + x + ',' + y); },
    toString: function () { return cmds.join(''); }
  };
}
d3.path = svgPath;

/* ---- 极简选择集（等价 d3 v4 select/selectAll 的本页用法子集）---- */
function select(sel) {
  if (typeof sel === 'string') return selection([document.querySelector(sel)]);
  return selection(sel && sel.length !== undefined ? Array.prototype.slice.call(sel) : [sel]);
}
function selectAll(sel) {
  return selection(Array.prototype.slice.call(document.querySelectorAll(sel)), document);
}
function selection(nodes, parent) {
  nodes = nodes || [];
  var sel = {
    _parent: parent || null,
    attr: function (name, value) {
      if (value === undefined) return nodes[0] ? nodes[0].getAttribute(name) : null;
      for (var i = 0; i < nodes.length; i++) {
        var v = typeof value === 'function' ? value.call(nodes[i], nodes[i].__datum, i) : value;
        if (v == null) nodes[i].removeAttribute(name); else nodes[i].setAttribute(name, v);
      }
      return sel;
    },
    style: function (name, value) {
      for (var i = 0; i < nodes.length; i++) {
        var v = typeof value === 'function' ? value.call(nodes[i], nodes[i].__datum, i) : value;
        nodes[i].style[name] = v;
      }
      return sel;
    },
    classed: function (name, add) {
      for (var i = 0; i < nodes.length; i++) {
        var cur = (nodes[i].getAttribute('class') || '').split(/\s+/).filter(function (s) { return s; });
        var names = name.split(/\s+/).filter(function (s) { return s; });
        for (var j = 0; j < names.length; j++) {
          var idx = cur.indexOf(names[j]);
          if (add && idx === -1) cur.push(names[j]);
          if (!add && idx !== -1) cur.splice(idx, 1);
        }
        if (cur.length) nodes[i].setAttribute('class', cur.join(' ')); else nodes[i].removeAttribute('class');
      }
      return sel;
    },
    text: function (value) {
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].textContent = typeof value === 'function' ? value.call(nodes[i], nodes[i].__datum, i) : value;
      }
      return sel;
    },
    data: function (data) {
      var parent = sel._parent || (nodes.length && nodes[0].parentNode) || null;
      var enterNodes = [], exitNodes = [];
      for (var i = 0; i < data.length; i++) {
        if (i < nodes.length) nodes[i].__datum = data[i];
        else enterNodes.push({ __parent: parent, __datum: data[i] });
      }
      for (var j = data.length; j < nodes.length; j++) exitNodes.push(nodes[j]);
      sel.__enter = selection(enterNodes);
      sel.__exit = selection(exitNodes);
      return sel;
    },
    enter: function () { return sel.__enter; },
    exit: function () { return sel.__exit; },
    append: function (tag) {
      var ns = 'http://www.w3.org/2000/svg';
      var out = [];
      for (var i = 0; i < nodes.length; i++) {
        var el = document.createElementNS(ns, tag);
        if (nodes[i].__parent) nodes[i].__parent.appendChild(el);
        if (nodes[i].__datum !== undefined) el.__datum = nodes[i].__datum;
        out.push(el);
      }
      return selection(out);
    },
    remove: function () {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].parentNode) nodes[i].parentNode.removeChild(nodes[i]);
      }
      return sel;
    },
    raise: function () {
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].parentNode) nodes[i].parentNode.appendChild(nodes[i]);
      }
      return sel;
    },
    selectAll: function (selector) {
      var out = [];
      var host = nodes.length ? nodes[0] : null;
      for (var i = 0; i < nodes.length; i++) {
        var found = nodes[i].querySelectorAll(selector == null ? '*' : selector);
        for (var j = 0; j < found.length; j++) out.push(found[j]);
      }
      return selection(out, host);
    }
  };
  return sel;
}
d3.select = select; d3.selectAll = selectAll;

/* ---- 二叉堆优先队列（复刻 js-priority-queue 的 BinaryHeapStrategy，行为一致）---- */
function PriorityQueue(cfg) {
  cfg = cfg || {};
  var cmp = cfg.comparator || function (a, b) { return (a || 0) - (b || 0); };
  var data = [];
  function swap(a, i, j) { var t = a[i]; a[i] = a[j]; a[j] = t; }
  function bubbleUp(pos) {
    while (pos > 0) {
      var parent = (pos - 1) >> 1;
      if (cmp(data[parent], data[pos]) < 0) break;
      swap(data, parent, pos);
      pos = parent;
    }
  }
  function sinkDown(pos) {
    while (true) {
      var left = 2 * pos + 1, right = 2 * pos + 2, minIndex = pos;
      if (left < data.length && cmp(data[left], data[minIndex]) < 0) minIndex = left;
      if (right < data.length && cmp(data[right], data[minIndex]) < 0) minIndex = right;
      if (minIndex !== pos) { swap(data, minIndex, pos); pos = minIndex; }
      else break;
    }
  }
  return {
    queue: function (value) { data.push(value); bubbleUp(data.length - 1); },
    dequeue: function () {
      var ret = data[0];
      var last = data.pop();
      if (data.length > 0) { data[0] = last; sinkDown(0); }
      return ret;
    },
    get length() { return data.length; }
  };
}


</script>

<script>
function shuffled(list) {
    var newlist = [];
    for (var i = 0; i < list.length; i++) {
        newlist.push(list[i]);
    }
    for (var i = list.length - 1; i > 0; i--) {
        var tmp = newlist[i];
        var j = randrange(i);
        newlist[i] = newlist[j];
        newlist[j] = tmp;
    }
    return newlist;
}

function choose(list, exponent) {
    exponent = exponent || 1;
    return list[Math.floor(Math.pow(Math.random(), exponent) * list.length)];
}

function randrange(lo, hi) {
    if (hi == undefined) {
        hi = lo;
        lo = 0;
    }
    return Math.floor(Math.random() * (hi - lo)) + lo;
}

function join(list, sep) {
    if (list.length == 0) return '';
    sep = sep || '';
    var s = list[0];
    for (var i = 1; i < list.length; i++) {
        s += sep;
        s += list[i];
    }
    return s;
}

function capitalize(word) {
    return word[0].toUpperCase() + word.slice(1);
}

function spell(lang, syll) {
    if (lang.noortho) return syll;
    var s = '';
    for (var i = 0; i < syll.length; i++) {
        var c = syll[i];
        s += lang.cortho[c] || lang.vortho[c] || defaultOrtho[c] || c;
    }
    return s;
}

function makeSyllable(lang) {
    while (true) {
        var syll = "";
        for (var i = 0; i < lang.structure.length; i++) {
            var ptype = lang.structure[i];
            if (lang.structure[i+1] == '?') {
                i++;
                if (Math.random() < 0.5) {
                    continue;
                }
            }
            syll += choose(lang.phonemes[ptype], lang.exponent);
        }
        var bad = false;
        for (var i = 0; i < lang.restricts.length; i++) {
            if (lang.restricts[i].test(syll)) {
                bad = true;
                break;
            }
        }
        if (bad) continue;
        return spell(lang, syll);
    }
}

function getMorpheme(lang, key) {
    if (lang.nomorph) {
        return makeSyllable(lang);
    }
    key = key || '';
    var list = lang.morphemes[key] || [];
    var extras = 10;
    if (key) extras = 1;
    while (true) {
        var n = randrange(list.length + extras);
        if (list[n]) return list[n];
        var morph = makeSyllable(lang);
        var bad = false;
        for (var k in lang.morphemes) {
            if (lang.morphemes[k].includes(morph)) {
                bad = true;
                break;
            }
        }
        if (bad) continue;
        list.push(morph);
        lang.morphemes[key] = list;
        return morph;
    }
}

function makeWord(lang, key) {
    var nsylls = randrange(lang.minsyll, lang.maxsyll + 1);
    var w = '';
    var keys = [];
    keys[randrange(nsylls)] = key;
    for (var i = 0; i < nsylls; i++) {
        w += getMorpheme(lang, keys[i]);
    }
    return w;
}

function getWord(lang, key) {
    key = key || '';
    var ws = lang.words[key] || [];
    var extras = 3;
    if (key) extras = 2;
    while (true) {
        var n = randrange(ws.length + extras);
        var w = ws[n];
        if (w) {
            return w;
        }
        w = makeWord(lang, key);
        var bad = false;
        for (var k in lang.words) {
            if (lang.words[k].includes(w)) {
                bad = true;
                break;
            }
        }
        if (bad) continue;
        ws.push(w);
        lang.words[key] = ws;
        return w;
    }
}
function makeName(lang, key) {
    key = key || '';
    lang.genitive = lang.genitive || getMorpheme(lang, 'of');
    lang.definite = lang.definite || getMorpheme(lang, 'the');
    var tries = 0;
    while (true) {
        if (++tries > 2000) {   // 防呆：名字组合极端紧张时给唯一兜底名（正常场景不会触发）
            var fb = 'Unnamed' + (lang.names.length + 1);
            lang.names.push(fb);
            return fb;
        }
        var name = null;
        if (Math.random() < 0.5) {
            name = capitalize(getWord(lang, key));
        } else {
            var w1 = capitalize(getWord(lang, Math.random() < 0.6 ? key : ''));
            var w2 = capitalize(getWord(lang, Math.random() < 0.6 ? key : ''));
            if (w1 == w2) continue;
            if (Math.random() > 0.5) {
                name = join([w1, w2], lang.joiner);
            } else {
                name = join([w1, lang.genitive, w2], lang.joiner);
            }
        }
        if (Math.random() < 0.1) {
            name = join([lang.definite, name], lang.joiner);
        }

        if ((name.length < lang.minchar) || (name.length > lang.maxchar)) continue;
        var used = false;
        for (var i = 0; i < lang.names.length; i++) {
            var name2 = lang.names[i];
            if ((name.indexOf(name2) != -1) || (name2.indexOf(name) != -1)) {
                used = true;
                break;
            }
        }
        if (used) continue;
        lang.names.push(name);
        return name;
    }
}

function makeBasicLanguage() {
    return {
        phonemes: {
            C: "ptkmnls",
            V: "aeiou",
            S: "s",
            F: "mn",
            L: "rl"
        },
        structure: "CVC",
        exponent: 2,
        restricts: [],
        cortho: {},
        vortho: {},
        noortho: true,
        nomorph: true,
        minsyll: 1,
        maxsyll: 1,
        morphemes: {},
        words: {},
        names: [],
        joiner: ' ',
        maxchar: 12,
        minchar: 5
    };
}

function makeRandomLanguage() {
    var lang = makeBasicLanguage();
    lang.noortho = false;
    lang.nomorph = false;
    lang.phonemes.C = shuffled(choose(consets, 2).C);
    lang.phonemes.V = shuffled(choose(vowsets, 2).V);
    lang.phonemes.L = shuffled(choose(lsets, 2).L);
    lang.phonemes.S = shuffled(choose(ssets, 2).S);
    lang.phonemes.F = shuffled(choose(fsets, 2).F);
    lang.structure = choose(syllstructs);
    lang.restricts = ressets[2].res;
    lang.cortho = choose(corthsets, 2).orth;
    lang.vortho = choose(vorthsets, 2).orth;
    lang.minsyll = randrange(1, 3);
    if (lang.structure.length < 3) lang.minsyll++;
    lang.maxsyll = randrange(lang.minsyll + 1, 7);
    lang.joiner = choose('   -');
    return lang;

"use strict";

function runif(lo, hi) {
    return lo + Math.random() * (hi - lo);

var rnorm = (function () {
    var z2 = null;
    function rnorm() {
        if (z2 != null) {
            var tmp = z2;
            z2 = null;
            return tmp;
        }
        var x1 = 0;
        var x2 = 0;
        var w = 2.0;
        while (w >= 1) {
            x1 = runif(-1, 1);
            x2 = runif(-1, 1);
            w = x1 * x1 + x2 * x2;
        }
        w = Math.sqrt(-2 * Math.log(w) / w);
        z2 = x2 * w;
        return x1 * w;
    }
    return rnorm;
})();

}

function improvePoints(pts, n, extent) {

            var slopes = trislope(h, nbs[j]);
            s += slopes[0] / 10;
            s2 += slopes[1];
        }
        s /= nbs.length;
        s2 /= nbs.length;
        s *= k;      // 世界放大 k 倍 → 世界单位梯度缩小 1/k → 补偿恢复（影线密度/坡度阈值/形态与 1x 完全一致）
        s2 *= k;
        if (Math.abs(s) < runif(0.1, 0.4)) continue;
        var l = r * runif(1, 2) * (1 - 0.2 * Math.pow(Math.atan(s), 2)) * Math.exp(s2/100);
        var x = h.mesh.vxs[i][0];
        var y = h.mesh.vxs[i][1];
        if (Math.abs(l*s) > 2 * r) {
            var n = Math.floor(Math.abs(l*s/r));
            l /= n;
            if (n > 4) n = 4;
            for (var j = 0; j < n; j++) {
                var u = rnorm() * r;
                var v = rnorm() * r;
                strokes.push([[x+u-l, y+v+l*s], [x+u+l, y+v-l*s]]);
            }
        } else {
            strokes.push([[x-l, y+l*s], [x+l, y-l*s]]);
        }
    }
    bindEnter(svg, 'line.slope', 'line', strokes)
        .attr('x1', function (d) {return 1000*d[0][0]})
        .attr('y1', function (d) {return 1000*d[0][1]})
        .attr('x2', function (d) {return 1000*d[1][0]})
        .attr('y2', function (d) {return 1000*d[1][1]})
        .attr('stroke-width', k * 1.25);   // 线宽随世界规模等比放大并略加粗（显示 ≈1.2px，1x 时 = 1.25）
}

function visualizeCities(svg, render) {
    var cities = render.cities;
    var h = render.h;
    var n = render.params.nterrs;

    bindEnter(svg, 'circle.city', 'circle', cities)
        .attr('cx', function (d) {return 1000*h.mesh.vxs[d][0]})
        .attr('cy', function (d) {return 1000*h.mesh.vxs[d][1]})
        .attr('r', function (d, i) {return i >= n ? 4 : 10})
        .style('fill', 'white')
        .style('stroke-width', 5)
        .style('stroke-linecap', 'round')
        .style('stroke', 'black')
        .raise();
}

function terrCenter(h, terr, city, landOnly) {
    var x = 0;
    var y = 0;
    var n = 0;
    for (var i = 0; i < terr.length; i++) {
        if (terr[i] != city) continue;
        if (landOnly && h[i] <= 0) continue;
        x += terr.mesh.vxs[i][0];
        y += terr.mesh.vxs[i][1];
        n++;
    }
    return [x/n, y/n];
}

/* ============ 通用词库系统：地形分类 + 词库注册表 ============
   地形标签（通用，与词库无关）：
     城市 {coast 临海, wet 近河/湖}  领地 {flat 平坦, dry 干燥河流少, wet 河流多}
   词库对象按地形标签提供名字部件池 → 新增词库只需在 LEXICONS 加条目，
   即可复用同一套地形分类与生成逻辑（不再是特定词库（奇幻/仙侠）的专用代码）。
   =============================================================== */
var zhUsed = [];
function zhPick(s) { return s[Math.floor(Math.random() * s.length)]; }
function zhPickWord(s) { var a = s.split(' '); return a[Math.floor(Math.random() * a.length)]; }
function zhOk(name) {
  if (name.length < 2 || name.length > 4) return false;
  for (var i = 0; i < zhUsed.length; i++) {
    var u = zhUsed[i];
    if (u.indexOf(name) !== -1 || name.indexOf(u) !== -1) return false;
  }
  zhUsed.push(name);
  return true;
}
/* 单个城市的地形分类（coast 临海 / wet 近河）：classifyTerrains 批量分类与
   手动新增城市命名（cityTerrainAt）共用同一套判断逻辑 */
function cityTerrClass(h, rivers, vx) {
    var coast = false;
    var nbs = neighbours(h.mesh, vx);
    for (var j = 0; j < nbs.length; j++) if (h[nbs[j]] <= 0) { coast = true; break; }
    var p = h.mesh.vxs[vx], wet = coast;               // 临海即水域；否则看近河
    if (!wet) {
        for (var i = 0; i < rivers.length; i++) {
            var rp = rivers[i];
            for (var k = 0; k < rp.length; k++) {
                var dx = rp[k][0] - p[0], dy = rp[k][1] - p[1];
                if (dx * dx + dy * dy < 0.0016) { wet = true; break; }   // 0.04 世界 ≈ 40px
            }
            if (wet) break;
        }
    }
    return {coast: coast, wet: wet};
}
/* 地形分类（通用）：为所有城市/领地计算地形标签 */
function classifyTerrains(render) {
  var h = render.h, terrArr = render.terr;
  var cities = render.cities;
  var nterrs = Math.min(render.params.nterrs, cities.length);
  var riverPts = [];
  for (var i = 0; i < render.rivers.length; i++) {
    var rp = render.rivers[i];
    for (var j = 0; j < rp.length; j++) riverPts.push(rp[j]);
  }
  var cityTerr = [];
  for (var i = 0; i < cities.length; i++) {
    cityTerr.push(cityTerrClass(h, render.rivers, cities[i]));   // 复用公共分类（与手动新增城市一致）
  }
  var regionTerr = [];
  for (var i = 0; i < nterrs; i++) {
    var cap = cities[i];
    var ssum = 0, cnt = 0;
    for (var j = 0; j < h.length; j++) if (terrArr[j] === cap) { ssum += h[j]; cnt++; }
    var mean = cnt ? ssum / cnt : 0;
    var vsum = 0;
    for (var j = 0; j < h.length; j++) if (terrArr[j] === cap) { var d = h[j] - mean; vsum += d * d; }
    var varr = cnt ? vsum / cnt : 0;
    var lc = terrCenter(h, terrArr, cap, true);
    var wetCnt = 0;
    for (var k = 0; k < riverPts.length; k++) {
      var dx = riverPts[k][0] - lc[0], dy = riverPts[k][1] - lc[1];
      if (dx * dx + dy * dy < 0.0036) wetCnt++;
    }
    regionTerr.push({flat: varr < 0.006, dry: wetCnt <= 2, wet: wetCnt > 2});
  }
  return {cities: cityTerr, regions: regionTerr};
}
/* 单个城市的地形分类（coast/wet），供手动新增城市命名使用（与 classifyTerrains 复用同一公共判断）*/
function cityTerrainAt(render, vx) {
    return cityTerrClass(render.h, render.rivers, vx);
}
/* 通用中文名生成器：lex=词库对象（提供部件池），terr=地形标签 */
function makeNameZh(key, lex, terr) {
  terr = terr || {};
  var sfx1 = (key === 'region') ? (terr.flat ? lex.regionSfx1.flat : lex.regionSfx1.hill) : '';
  var sfx2 = '';
  if (key === 'region') {
    if (terr.dry) sfx2 = lex.regionSfx2.dry;
    else if (terr.flat) sfx2 = lex.regionSfx2.flat;
    else sfx2 = lex.regionSfx2.hill;
  }
  var citySfx = (key === 'city') ? (terr.coast ? lex.citySfx.coast : (terr.wet ? lex.citySfx.wet : lex.citySfx.inland)) : '';
  for (var t = 0; t < 800; t++) {
    var m1 = zhPick(lex.m1), m2 = zhPick(lex.m2);
    var name;
    if (key === 'region') {
      var r = Math.random();
      if (r < 0.25) name = m1 + m2 + '之' + zhPick(sfx1);
      else if (r < 0.55) name = m1 + m2 + zhPick(sfx1);
      else name = m1 + m2 + zhPickWord(sfx2);
    } else {
      var r = Math.random();
      if (r < 0.08) name = m1 + zhPick(citySfx);
      else if (r < 0.28) name = m1 + m2 + '之' + zhPick(citySfx);
      else if (r < 0.96) name = m1 + m2 + zhPick(citySfx);
      else name = m1 + m2;
    }
    if (zhOk(name)) return name;
  }
  /* 兜底：组合空间极端紧张时返回序号唯一名（必须入表，否则多个兜底名会完全相同导致重名）*/
  var fb = '无名地' + (zhUsed.length + 1);
  zhUsed.push(fb);
  return fb;
}
/* 词库注册表：运行时由外部词库脚本填充（lexicons/lex-<id>.js 定义 window.LEX_DEFS[id]）。
   HTML 仅内置原版（英文音素）词库；新增词库 = 在 lexicons 文件夹加 .js 文件，
   并把 id 加入 lexicons/index.js 的 LEX_MANIFEST 清单（HTML 无需改动）。词库缺失/加载失败时回退原版。 */
var LEXICONS = {};
function getLex() { return LEXICONS[currentLex] || null; }
var lastLang = null;    // 最近一次生成的英文命名上下文（makeName 去重池），供手动新增城市命名复用
function drawLabels(svg, render) {
    var params = render.params;
    var h = render.h;
    var terr = render.terr;
    var cities = render.cities;
    var nterrs = render.params.nterrs;
    var avoids = [render.rivers, render.coasts, render.borders];
    lastLang = makeRandomLanguage();
    var lang = lastLang;
    zhUsed = []; // 每次生成重置中文名去重表
    // 先生成全部英文名、再生成全部中文名：随机流确定（同种子可复现），中文名独立
    var cityTextsEn = [], cityTextsZh = [], regionTextsEn = [], regionTextsZh = [];
    for (var i = 0; i < cities.length; i++) cityTextsEn.push(makeName(lang, 'city'));
    for (var i = 0; i < nterrs; i++) regionTextsEn.push(makeName(lang, 'region'));
    /* 通用地形分类 + 词库（currentLex 可切换）：城市 coast/wet、领地 flat/dry/wet */
    var terrains = classifyTerrains(render);
    var lex = getLex();
    if (lex) { // 外部词库已加载 → 生成中文名；原版（orig/词库缺失）时中文名占位空
      for (var i = 0; i < cities.length; i++) cityTextsZh.push(makeNameZh('city', lex, terrains.cities[i]));
      for (var i = 0; i < nterrs; i++) regionTextsZh.push(makeNameZh('region', lex, terrains.regions[i]));
    } else {
      for (var i = 0; i < cities.length; i++) cityTextsZh.push('');
      for (var i = 0; i < nterrs; i++) regionTextsZh.push('');
    }
    var citylabels = [];
    function penalty(label) {
        var pen = 0;
        if (label.x0 < -0.45 * h.mesh.extent.width) pen += 100;
        if (label.x1 > 0.45 * h.mesh.extent.width) pen += 100;
        if (label.y0 < -0.45 * h.mesh.extent.height) pen += 100;
        if (label.y1 > 0.45 * h.mesh.extent.height) pen += 100;
        for (var i = 0; i < citylabels.length; i++) {
            var olabel = citylabels[i];
            if (label.x0 < olabel.x1 && label.x1 > olabel.x0 &&
                label.y0 < olabel.y1 && label.y1 > olabel.y0) {
                pen += 100;
            }
        }

        for (var i = 0; i < cities.length; i++) {
            var c = h.mesh.vxs[cities[i]];
            if (label.x0 < c[0] && label.x1 > c[0] && label.y0 < c[1] && label.y1 > c[1]) {
                pen += 100;
            }
        }
        for (var i = 0; i < avoids.length; i++) {
            var avoid = avoids[i];
            for (var j = 0; j < avoid.length; j++) {
                var avpath = avoid[j];
                for (var k = 0; k < avpath.length; k++) {
                    var pt = avpath[k];
                    if (pt[0] > label.x0 && pt[0] < label.x1 && pt[1] > label.y0 && pt[1] < label.y1) {
                        pen++;
                    }
                }
            }
        }
        return pen;
    }
    for (var i = 0; i < cities.length; i++) {
        var x = h.mesh.vxs[cities[i]][0];
        var y = h.mesh.vxs[cities[i]][1];
        var textEn = cityTextsEn[i];
        var textZh = cityTextsZh[i];
        var size = i < nterrs ? params.fontsizes.city : params.fontsizes.town;
        var sx = 0.65 * size/1000 * Math.max(textEn.length, 1.7 * textZh.length);
        var sy = size/1000;
        var posslabels = [
        {
            x: x + 0.8 * sy,
            y: y + 0.3 * sy,
            align: 'start',
            x0: x + 0.7 * sy,
            y0: y - 0.6 * sy,
            x1: x + 0.7 * sy + sx,
            y1: y + 0.6 * sy
        },
        {
            x: x - 0.8 * sy,
            y: y + 0.3 * sy,
            align: 'end',
            x0: x - 0.9 * sy - sx,
            y0: y - 0.7 * sy,
            x1: x - 0.9 * sy,
            y1: y + 0.7 * sy
        },
        {
            x: x,
            y: y - 0.8 * sy,
            align: 'middle',
            x0: x - sx/2,
            y0: y - 1.9*sy,
            x1: x + sx/2,
            y1: y - 0.7 * sy
        },
        {
            x: x,
            y: y + 1.2 * sy,
            align: 'middle',
            x0: x - sx/2,
            y0: y + 0.1*sy,
            x1: x + sx/2,
            y1: y + 1.3*sy
        }
        ];
        var label = posslabels[d3.scan(posslabels, function (a, b) {return penalty(a) - penalty(b)})];
        label.text = textEn;
        label.textZh = textZh;
        label.size = size;
        citylabels.push(label);
    }
    bindEnter(svg, 'text.city', 'text', citylabels)
        .attr('x', function (d) {return 1000*d.x})
        .attr('y', function (d) {return 1000*d.y})
        .style('font-size', function (d) {return d.size})
        .style('text-anchor', function (d) {return d.align})
        .classed('fantasy', currentLex !== 'orig')
        .text(function (d) {return currentLex !== 'orig' ? d.textZh : d.text})
        .raise();

    var reglabels = [];
    for (var i = 0; i < nterrs; i++) {
        var city = cities[i];
        var textEn = regionTextsEn[i];
        var textZh = regionTextsZh[i];
        var sy = params.fontsizes.region / 1000;
        var sx = 0.6 * Math.max(textEn.length, 1.7 * textZh.length) * sy;
        var lc = terrCenter(h, terr, city, true);
        var oc = terrCenter(h, terr, city, false);
        var best = 0;
        var bestscore = -999999;
        for (var j = 0; j < h.length; j++) {
            var score = 0;
            var v = h.mesh.vxs[j];
            score -= 3000 * Math.sqrt((v[0] - lc[0]) * (v[0] - lc[0]) + (v[1] - lc[1]) * (v[1] - lc[1]));
            score -= 1000 * Math.sqrt((v[0] - oc[0]) * (v[0] - oc[0]) + (v[1] - oc[1]) * (v[1] - oc[1]));
            if (terr[j] != city) score -= 3000;
            for (var k = 0; k < cities.length; k++) {
                var u = h.mesh.vxs[cities[k]];
                if (Math.abs(v[0] - u[0]) < sx && 
                    Math.abs(v[1] - sy/2 - u[1]) < sy) {
                    score -= k < nterrs ? 4000 : 500;
                }
                if (v[0] - sx/2 < citylabels[k].x1 &&
                    v[0] + sx/2 > citylabels[k].x0 &&
                    v[1] - sy < citylabels[k].y1 &&
                    v[1] > citylabels[k].y0) {
                    score -= 5000;
                }
            }
            for (var k = 0; k < reglabels.length; k++) {
                var label = reglabels[k];
                if (v[0] - sx/2 < label.x + label.width/2 &&
                    v[0] + sx/2 > label.x - label.width/2 &&
                    v[1] - sy < label.y &&
                    v[1] > label.y - label.size) {
                    score -= 20000;
                }
            }
            if (h[j] <= 0) score -= 500;
            if (v[0] + sx/2 > 0.5 * h.mesh.extent.width) score -= 50000;
            if (v[0] - sx/2 < -0.5 * h.mesh.extent.width) score -= 50000;
            if (v[1] > 0.5 * h.mesh.extent.height) score -= 50000;
            if (v[1] - sy < -0.5 * h.mesh.extent.height) score -= 50000;
            if (score > bestscore) {
                bestscore = score;
                best = j;
            }
        }
        reglabels.push({
            text: textEn,
            textZh: textZh, 
            x: h.mesh.vxs[best][0], 
            y: h.mesh.vxs[best][1], 
            size:sy, 
            width:sx
        });
    }
    bindEnter(svg, 'text.region', 'text', reglabels)
        .attr('x', function (d) {return 1000*d.x})
        .attr('y', function (d) {return 1000*d.y})
        .style('font-size', function (d) {return 1000*d.size})
        .style('text-anchor', 'middle')
        .classed('fantasy', currentLex !== 'orig')
        .text(function (d) {return currentLex !== 'orig' ? d.textZh : d.text})
        .raise();

}
/* ---- 分步生成（UI 体验优化）：把地图生成切成多个阶段，阶段间让出主线程并更新进度提示，
       避免生成期间页面完全冻结；各阶段计算内容与顺序与单次生成完全一致 → 结果不变 ---- */
function genCoastMesh(params) {   // 第 1 段：Voronoi 网格
    return generateGoodMesh(params.npts, params.extent);
}
function genCoastField(mesh) {    // 第 2 段：高度场（侵蚀/海平面/海岸清洗等全部地形流程）
    var h = add(slope(mesh, randomVector(4)), cone(mesh, runif(-1, -1)), mountains(mesh, 50));
    for (var i = 0; i < 10; i++) h = relax(h);
    h = peaky(h);
    h = doErosion(h, runif(0, 0.1), 5);
    h = setSeaLevel(h, runif(0.2, 0.6));
    h = fillSinks(h);
    return cleanCoast(h, 3);
}
function doMapStepped(svg, params, step, done) {
    var status = document.getElementById('status');
    if (step === 0) {   // 初始化：视图框 + 清空
        render = { params: params };
        var width = svg.attr('width');
        svg.attr('height', width * params.extent.height / params.extent.width);
        svg.attr('viewBox', -1000 * params.extent.width/2 + ' ' + -1000 * params.extent.height/2 + ' ' +
                 1000 * params.extent.width + ' ' + 1000 * params.extent.height);
        svg.selectAll().remove();
        status.textContent = '生成中… ① 构建地形网格';
        setTimeout(function () { doMapStepped(svg, params, 1, done); }, 16);
        return;
    }
    if (step === 1) {   // 网格 + 高度场（最耗时段）
        render.mesh = genCoastMesh(params);
        render.h = genCoastField(render.mesh);
        status.textContent = '生成中… ② 放置城市';
        setTimeout(function () { doMapStepped(svg, params, 2, done); }, 16);
        return;
    }
    if (step === 2) {   // 城市
        placeCities(render);
        status.textContent = '生成中… ③ 计算河流与领地';
        setTimeout(function () { doMapStepped(svg, params, 3, done); }, 16);
        return;
    }
    if (step === 3) {   // 河流 / 海岸 / 领地 / 边界
        render.rivers = getRivers(render.h, 0.01);
        render.coasts = contour(render.h, 0);
        render.terr = getTerritories(render);
        render.borders = getBorders(render);
        status.textContent = '生成中… ④ 计算道路';
        setTimeout(function () { doMapStepped(svg, params, 4, done); }, 16);
        return;
    }
    if (step === 4) {   // 道路
        var roads = getRoads(render);
        render.landRoads = roads.land;
        render.seaRoads = roads.sea;
        status.textContent = '生成中… ⑤ 绘制地图';
        setTimeout(function () { doMapStepped(svg, params, 5, done); }, 16);
        return;
    }
    /* step 5：绘制（与原 drawMap 一致）*/
    drawPaths(svg, 'river', render.rivers);
    drawPaths(svg, 'coast', render.coasts);
    drawPaths(svg, 'border', render.borders);
    drawPaths(svg, 'road', render.landRoads);
    drawPaths(svg, 'roadsea', render.seaRoads);
    visualizeSlopes(svg, render);
    visualizeCities(svg, render);
    drawLabels(svg, render);
    if (done) done();
}

var defaultParams = {
    extent: defaultExtent,
    npts: 16384,
    ncities: 15,
    nterrs: 5,
    fontsizes: {
        region: 40,
        city: 25,
        town: 20
    }
}


</script>
<script>
/* 词库清单（manifest）：列出 lexicons/ 文件夹下所有词库的 id
   新增词库步骤（HTML 无需任何改动）：
     1. 在 lexicons/ 文件夹放入 lex-<id>.js（<id> 为词库唯一标识，全小写英文）
     2. 把 '<id>' 加入下方数组
     3. 重新打开 HTML 即自动加载。清单缺失时 HTML 自动回退「原版」。 */
window.LEX_MANIFEST = ['fantasy', 'xiuxian'];

</script>
<script>
/* 词库: 奇幻风格
   字段格式说明：
     label      词库显示名
     m1 / m2    首字库 / 次字库（组合成双字修饰，如 深+水 → 深水）
     citySfx    城市后缀池，按城市地形分为 coast（临海）/ wet（近水）/ inland（内陆）
     regionSfx1 领地单字后缀，按领地地形分为 flat（平坦）/ hill（山地）
     regionSfx2 领地双字后缀，按领地地形分为 flat / hill / dry（干燥）
*/
window.LEX_DEFS = window.LEX_DEFS || {};
window.LEX_DEFS['fantasy'] = {

function placeCityAt(e) {

function deleteCity(idx, silent, noRecord, noRedraw) {

  var nterrs = Math.min(render.params.nterrs, render.cities.length);

    if (isExtra) {

  if (!noRedraw) {   // 批量恢复模式：跳过逐次重算，由调用方在循环结束后统一重算重绘

        lines.push('  [' + it.idx + '] ' + it.name + ' (' + deletedCities[it.dd].x + ', ' + deletedCities[it.dd].y + ', deleted)');
      } else if (it.kind === 'extra') {
        lines.push('  [' + it.idx + '] ' + cityNames[it.ci] + ' (' + extraCities[it.ej].x + ', ' + extraCities[it.ej].y + ', new)');
      } else {
        lines.push('  [' + it.idx + '] ' + cityNames[it.ci] + ' (' + wcs(render.cities[it.ci]) + ', normal)');
      }
    }
  }
  var text = lines.join('\n');
  var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  downloadBlob(blob, '地图数据-种子' + lastGenParams.seedTxt + '.txt');
  statusbar('已导出数据：种子 ' + lastGenParams.seedTxt + ' · ' + regNames.length + ' 领地 / ' + cityNames.length + ' 城市（含新增 ' + extraCities.length + '）');
}
/* 解析导入文件（txt 纯文本，最新版格式：英文字段名 + 中英双语注释），返回统一结构
   { params, names, extraCities, deletedCities }
   - params: { seedTxt, npts, ncities, nterrs, extent }
   - names: { byIndex, byRegionIndex }（按索引恢复名称）
   - extraCities: [{x, y, name}]（new 状态城市，坐标为世界坐标）
   - deletedCities: [{idx, name}]（deleted 状态城市，按索引删除）
   归属列表行格式：城市名后带括号 (x, y, 状态) → 状态为 normal / new / deleted。
   仅支持最新版格式（Seed / World Scale / Cells / Territories / Cities），不再兼容旧中文字段名 */
function parseMapData(text) {
  var s = String(text).replace(/^\uFEFF/, '').trim();
  if (!s) return null;
  var params = { seedTxt: '', npts: 0, ncities: 0, nterrs: 0, extent: null };
  var byIndex = {}, byRegionIndex = {};
  var extraCities = [], deletedCities = [];
  var lines = s.split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line || line.charAt(0) === '#') continue;
    var m;
    if ((m = line.match(/^Seed\s*[:：]\s*(.+)$/i))) { params.seedTxt = m[1].trim(); }
    else if ((m = line.match(/^World\s*Scale\s*[:：]\s*(\d+)/i))) { var kv = Math.min(Math.round(+m[1]), 4) || 1; params.extent = { width: kv, height: kv }; }
    else if ((m = line.match(/^Cells?\s*[:：]\s*(\d+)/i))) { params.npts = +m[1]; }
    else if ((m = line.match(/^Territories?\s*[:：]\s*(\d+)/i))) { params.nterrs = +m[1]; }
    else if ((m = line.match(/^Cities?\s*[:：]\s*(\d+)/i))) { params.ncities = +m[1]; }
    else if ((m = line.match(/^\[(.+)\]$/))) { byRegionIndex[Object.keys(byRegionIndex).length] = m[1].trim(); }
    else if ((m = line.match(/^\[(\d+)\]\s*(.+)$/))) {
      var idx = +m[1];
      var nm = m[2].trim();
      /* 统一三值括号 (x, y, 状态)：normal 普通 / new 新增 / deleted 已删除（仅支持此格式，不兼容旧两值格式） */
      var cm = nm.match(/^(.*?)\s*[（(]\s*(-?\d+(?:\.\d+)?)\s*[，,]\s*(-?\d+(?:\.\d+)?)\s*[，,]\s*([a-zA-Z]+)\s*[）)]\s*$/);
      if (cm) {
        nm = cm[1].trim();
        var st = cm[4].toLowerCase();
        if (st === 'new') {
          /* 新增城市：坐标为世界坐标（-500k~500k），导入时 ÷1000 还原网格坐标定位 */
          if (nm) byIndex[idx] = nm;
          extraCities.push({ x: +cm[2], y: +cm[3], name: nm });
        } else if (st === 'deleted') {
          /* 已删除城市：按索引删除（坐标仅作展示，不参与定位）*/
          deletedCities.push({ idx: idx, name: nm || ('City ' + idx) });
        } else {
          /* normal 等普通状态：仅恢复名称，坐标为展示信息，位置由种子决定 */
          if (nm) byIndex[idx] = nm;
        }
      } else {
        nm = nm.trim();
        if (nm) byIndex[idx] = nm;
      }
    }
  }
  if (!params.seedTxt && !params.npts) throw new Error('缺少必要字段（需 Seed / Cells，仅支持最新版导出格式）');
  return { params: params, names: { byIndex: byIndex, byRegionIndex: byRegionIndex }, extraCities: extraCities, deletedCities: deletedCities };
}
function onImportFile(e) {
  var f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var data = parseMapData(rd.result);
      if (!data) throw new Error('文件为空');
      if (generating) { statusbar('正在生成中，请稍后再导入'); return; }
      var p = data.params;
      document.getElementById('seed').value = p.seedTxt || '';
      if (p.npts) document.getElementById('npts').value = p.npts;
      if (p.ncities) document.getElementById('ncities').value = p.ncities;
      if (p.nterrs) document.getElementById('nterrs').value = p.nterrs;
      /* 恢复世界规模档位（超限值回落 4x）*/
      if (p.extent && p.extent.width) {
        var k = Math.min(Math.round(p.extent.width), 4);
        var sel = document.getElementById('resol');
        if (sel && [1, 2, 4].indexOf(k) >= 0) sel.value = String(k);
        worldK = (k >= 1 && k <= 4) ? k : 1;
      }
      updateCapacityLimits();
      /* 手动编辑 txt 可能让城市/领地数超当前档位上限 → 裁剪，避免超密生成 */
      (function () {
        var ncEl = document.getElementById('ncities'), ntEl = document.getElementById('nterrs');
        if (ncEl && ncEl.max && parseInt(ncEl.value, 10) > parseInt(ncEl.max, 10)) ncEl.value = ncEl.max;
        if (ntEl && ntEl.max && parseInt(ntEl.value, 10) > parseInt(ntEl.max, 10)) ntEl.value = ntEl.max;
      })();
      pendingNames = data.names || null;
      pendingExtra = data.extraCities && data.extraCities.length ? data.extraCities : null;
      pendingDeleted = data.deletedCities && data.deletedCities.length ? data.deletedCities : null;
      statusbar('正在导入：种子 ' + (p.seedTxt || '') + ' …');
      gen();
    } catch (err) {
      statusbar('导入失败：文件不是有效的导出数据（可先导出一份对照格式）。' + err.message);
    }
  };
  rd.onerror = function () { statusbar('导入失败：文件读取错误'); };
  rd.readAsText(f);
}
/* 把保存的名称按索引应用到新生成的领地 / 城市标签（与行内改名的 editSave 逻辑一致）*/
function applyImportedNames(names) {
  editing = null;
  var regEls = document.querySelectorAll('#map text.region');
  var cityEls = document.querySelectorAll('#map text.city');
  for (var ri = 0; ri < regEls.length; ri++) {
    var rv = names && names.byRegionIndex && names.byRegionIndex[ri];
    if (!rv) continue;
    var dr = regEls[ri].__datum;
    if (dr) { dr.text = rv; dr.textZh = rv; }
    regEls[ri].textContent = rv;
  }
  for (var ci = 0; ci < cityEls.length; ci++) {
    var cv = names && names.byIndex && names.byIndex[ci];
    if (!cv) continue;
    var dc = cityEls[ci].__datum;
    if (dc) { dc.text = cv; dc.textZh = cv; }
    cityEls[ci].textContent = cv;
  }
}

var generating = false;   // 生成中标志：防止生成期间重复点击
function gen() {
  if (generating) return;   // 生成中忽略重复点击
  var seedTxt = document.getElementById('seed').value.trim();
  var seed;
  if (/^\d+$/.test(seedTxt)) {
    seed = parseInt(seedTxt, 10) >>> 0;              // 数字种子：直接使用，不哈希 —— 输入框值 = 地图种子 = 状态栏显示，生成按钮不改动输入框
  } else if (seedTxt) {
    seed = hashStr(seedTxt);                         // 文字种子：哈希后使用（原版行为，仍可复现）
  } else {
    seed = (Math.floor(Math.random() * 1e9) >>> 0);  // 空种子：随机生成并填入输入框
    document.getElementById('seed').value = seed;
  }
  Math.random = mulberry32(seed);
  extraCities = pendingExtra || [];   // 重新生成 → 手动新增城市重置；导入时替换为导入数据
  pendingExtra = null;
  deletedCities = pendingDeleted || [];   // 已删除的初始城市同理（导入恢复时应用）
  pendingDeleted = null;
  var params = Object.assign({}, defaultParams);
  params.npts = parseInt(document.getElementById('npts').value, 10);
  params.ncities = parseInt(document.getElementById('ncities').value, 10) || 15;
  params.nterrs = Math.min(parseInt(document.getElementById('nterrs').value, 10) || 5, params.ncities);
  /* 世界规模档位 → extent：世界等比放大（面积 = 倍率²），组件尺寸不变，同屏容纳更多领地 */
  var k = resScale();
  worldK = k;
  params.extent = { width: k, height: k };
  vb = { x: -500 * k, y: -500 * k, w: 1000 * k, h: 1000 * k };  // 缩放状态同步到新世界全貌
  updateCapacityLimits();
  lastGenParams = {   // 记录本次生成生效的参数（导出数据用；种子以最终数字为准，可复现）
    seed: seed,
    seedTxt: document.getElementById('seed').value.trim() || String(seed),
    npts: params.npts,
    ncities: params.ncities,
    nterrs: params.nterrs,
    extent: { width: k, height: k }
  };
  var gb = document.getElementById('genbtn');
  generating = true;
  if (gb) { gb.disabled = true; gb.textContent = '生成中…'; }
  statusbar('生成中…（' + params.npts.toLocaleString() + ' 细胞 · 种子 ' + seed + '）');
  setTimeout(function () {
    var t0 = Date.now();
    try {
      doMapStepped(svg, params, 0, function () {
        applyLayers();      // 重新生成后应用当前的隐藏设置（svg 已被清空重建）
        clearHighlight();   // 重新生成 → 名称修改恢复默认
        var imported = false;
        if (pendingNames) { applyImportedNames(pendingNames); pendingNames = null; imported = true; }
        /* 恢复已删除城市（导入数据）：按原始索引从大到小删除（noRedraw 仅删数据+DOM，不逐次重算道路）*/
        var hasDeleted = deletedCities && deletedCities.length;
        if (hasDeleted) {
          var dels = deletedCities.slice().sort(function (a, b) { return b.idx - a.idx; });
          var nterrs0 = Math.min(render.params.nterrs, render.cities.length);
          for (var di = 0; di < dels.length; di++) {
            var dci = dels[di].idx;
            if (dci >= nterrs0 && dci < render.cities.length) {
              /* 补全领地与坐标（导入的 deleted 行只有 idx/name）——供再次导出时归位到领地段落并带坐标 */
              var dvx = render.cities[dci];
              var dterr = render.cities.indexOf(render.terr[dvx]);
              var dpv = render.h.mesh.vxs[dvx];
              dels[di].terr = dterr < 0 ? 0 : dterr;
              dels[di].x = +(dpv[0] * 1000).toFixed(2);
              dels[di].y = +(dpv[1] * 1000).toFixed(2);
              deleteCity(dci, true, true, true);
              imported = true;
            }
          }
        }
        /* 恢复手动新增城市（导入数据）：addCityToRender 增量加路（只算新路，不逐次/不额外全量重算），
           收集新增城市，循环结束后统一绘制一次 */
        var addedCities = [];
        if (extraCities && extraCities.length) {
          for (var ei = 0; ei < extraCities.length; ei++) {
            var ec = extraCities[ei];
            /* 括号坐标为世界坐标（-500k~500k）→ ÷1000 还原网格坐标（mesh.vxs 单位）定位最近顶点 */
            var vx2 = nearestVx(ec.x / 1000, ec.y / 1000);
            if (render.h[vx2] <= 0) continue;
            if (render.cities.indexOf(vx2) >= 0) continue;   // 已占用（与 placeCityAt 校验一致）
            addCityToRender(render, vx2);
            addedCities.push({ vx: vx2, name: ec.name });
            imported = true;
          }
        }
        /* 有删除 → 删除后路网需全量重连一次（含剩余与新增城市）*/
        if (hasDeleted) {
          var roads = getRoads(render);
          render.landRoads = roads.land;
          render.seaRoads = roads.sea;
        }
        /* 统一绘制一次（道路 + 城市圆点 + 新增城市文本）*/
        if (addedCities.length || hasDeleted) {
          var sel = d3.select('#map');
          drawPaths(sel, 'road', render.landRoads);
          drawPaths(sel, 'roadsea', render.seaRoads);
          visualizeCities(sel, render);
          sel.selectAll('text.city').raise();
          /* 新增城市文本（样式与 placeExtraCity 一致）*/
          var zh = currentLex !== 'orig';
          for (var ai = 0; ai < addedCities.length; ai++) {
            var pp = render.h.mesh.vxs[addedCities[ai].vx];
            var tt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            tt.setAttribute('class', 'city' + (zh ? ' fantasy' : ''));
            tt.setAttribute('x', 1000 * pp[0]);
            tt.setAttribute('y', 1000 * (pp[1] - 0.016 * worldK));
            tt.setAttribute('text-anchor', 'middle');
            tt.textContent = addedCities[ai].name;
            tt.__datum = { text: addedCities[ai].name, textZh: addedCities[ai].name };
            mapEl.appendChild(tt);
          }
        }
        renderSideTree();
        generating = false;
        if (gb) { gb.disabled = false; gb.textContent = '生成地图'; }
        statusbar((imported ? '已导入 · ' : '') + '完成 · 用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's · 种子 ' + seed + '（同种子可复现）');
      });
    } catch (e) {
      generating = false;
      if (gb) { gb.disabled = false; gb.textContent = '生成地图'; }
      statusbar('生成出错: ' + e.message);
      console.error(e);
    }
  }, 30);
}
renderSideTree();   // 页面初始化：侧栏显示「先生成地图」提示

</script>
