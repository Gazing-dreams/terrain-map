<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mewo2/terrain 程序化大陆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body { font-family: 'Georgia', 'Songti SC', serif; background: #3d2f24; color: #e8dcc0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; color: #f0e0c0; margin-bottom: 6px; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 12px; color: #b8a488; margin-bottom: 16px; line-height: 1.7; }
  .sub b { color: #d8c090; }
  .controls { display: flex; flex-wrap: nowrap; gap: 10px; justify-content: center; align-items: center; margin-bottom: 14px; background: #4a3a2c; border-radius: 10px; padding: 10px 14px; }
  .controls label { font-size: 13px; color: #d8c8a8; }
  .controls select, .controls input { background: #5a4836; color: #f0e4c8; border: 1px solid #8a6f52; border-radius: 6px; padding: 5px 8px; font-size: 13px; font-family: inherit; }
  .controls button { background: #8a5a2a; color: #fff6e6; border: none; border-radius: 8px; padding: 7px 18px; font-size: 14px; cursor: pointer; font-family: inherit; letter-spacing: 1px; }
  .controls button:hover { background: #a06a30; }
  #status { font-size: 12px; color: #c8b898; text-align: center; margin-bottom: 10px; min-height: 16px; }
  .mapbox { background: #f5ecd7; border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.45); position: relative; overflow: auto; width: fit-content; margin: 0 auto; }
  .map-wrap { position: relative; width: fit-content; margin: 0 auto; }
  .mapbox.fullscreen { position: fixed; inset: 0; width: 100%; z-index: 9999; border-radius: 0; padding: 12px; background: #241b12; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .mapbox.fullscreen svg#map { max-width: 96vw; max-height: 94vh; }
  .map-tools { position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; max-width: 470px; overflow: hidden; transition: max-width .35s ease; }
  .map-tools.collapsed { max-width: 32px; }
  .map-tools .tool-group { display: flex; gap: 5px; align-items: center; padding-right: 32px; opacity: 1; transition: opacity .25s ease; }
  .map-tools.collapsed .tool-group { opacity: 0; pointer-events: none; }
  .map-tools button { background:#5a4836; color:#f0e4c8; border:1px solid #8a6f52; border-radius:6px; cursor:pointer; padding:4px 10px; font-size:13px; font-family:inherit; flex-shrink: 0; white-space: nowrap; }
  .map-tools button:hover { background:#6a5540; }
  /* 折叠按钮绝对定位于右侧，不参与 flex 收缩，折叠时永远可见 */
  .map-tools .fold-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); z-index: 2; flex-shrink: 0; min-width: 24px; padding: 4px 6px; text-align: center; }
  /* 图层显隐开关：隐藏时按钮高亮（橙色）表示该层当前被隐藏 */
  .map-tools .sep { width: 1px; height: 20px; align-self: center; background: #8a6f52; margin: 0 2px; flex-shrink: 0; }
  .map-tools button.layer-btn.active { background: #c0762e; color: #fff6e6; border-color: #e8b070; }
  .map-tools button.layer-btn.active:hover { background: #d0863e; }
  /* 被隐藏的图层：标记与文字一律不显示 */
  svg#map .layer-hidden { display: none; }
  svg#map { cursor: grab; touch-action: none; display: block; width: 100%; height: auto; background: #f5ecd7; border-radius: 8px; }
  svg#map.dragging { cursor: grabbing; }
  /* 羊皮纸风样式（mewo2/terrain 原版风格） */
  path.river { fill: none; stroke: #7fa8c9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  path.coast { fill: none; stroke: #8a6a4a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  path.border { fill: none; stroke: #a08060; stroke-width: 1.6; stroke-dasharray: 10 5; opacity: .65; }
  path.road { fill: none; stroke: #4a2f16; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
  path.roadsea { fill: none; stroke: #4a2f16; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; opacity: .55; }
  line.slope { stroke: #9a7b52; opacity: .5; }
  circle.city { fill: #fdf6e3; stroke: #4a3018; stroke-width: 3; }
  text.city { font-family: Georgia, serif; fill: #3a2a18; font-size: 20px; font-weight: bold; paint-order: stroke; stroke: #f5ecd7; stroke-width: 3px; stroke-linejoin: round; }
  text.region { font-family: Georgia, serif; fill: #6a4a28; font-size: 36px; font-style: italic; letter-spacing: 3px; paint-order: stroke; stroke: #f5ecd7; stroke-width: 4px; stroke-linejoin: round; opacity: .85; }
  text.city.dnd, text.region.dnd { font-family: "KaiTi","STKaiti","SimSun",serif; }
  .note { margin-top: 14px; font-size: 12px; color: #b8a488; line-height: 1.9; background: #4a3a2c; border-radius: 10px; padding: 12px 16px; }
  .note b { color: #e8c890; }
  .controls label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .controls select, .controls input, .controls button { flex-shrink: 0; white-space: nowrap; }
  button.seed-rnd { height: 30px; line-height: 28px; padding: 0 9px; background:#5a4836; color:#f0e4c8; border:1px solid #8a6f52; border-radius:6px; cursor:pointer; font-size:13px; }
  button.seed-rnd:hover { background:#6a5540; }
</style>
</head>
<body>
<div class="wrap">
<h1>程序化大陆</h1>
<p class="sub">来源：<b>mewo2/terrain</b>（MIT · 2016 · 1073 行单文件）</p>
<div class="controls">
  <label>细胞数
    <select id="npts">
      <option value="4096">4k（快）</option>
      <option value="8192">8k（中）</option>
      <option value="16384" selected>16k（默认）</option>
      <option value="32768">32k（高细节）</option>
      <option value="65536">64k（最高·重）</option>
    </select>
  </label>
  <label>领地数 <input id="nterrs" type="number" value="5" min="1" max="15" style="width:50px" title="领地（区域）数量，自动不超过城市数"></label>
  <label>城市数 <input id="ncities" type="number" value="15" min="4" max="40" style="width:60px"></label>
  <label>种子 <input id="seed" type="text" placeholder="留空 = 随机" style="width:130px"><button type="button" onclick="randomSeed()" title="随机种子" class="seed-rnd">↻</button></label>
  <button onclick="gen()">生成地图</button>
  <label>词库 <select id="lexsel" onchange="setLex(this.value)"></select></label>
</div>
<div id="status">点击「生成地图」开始</div>
<div class="mapbox">
  <div class="map-wrap">
    <div class="map-tools">
      <span class="tool-group">
        <button onclick="zoomBy(1.25)" title="缩小">−</button>
        <button onclick="zoomBy(0.8)" title="放大">+</button>
        <button onclick="resetView()" title="复位全貌">全貌</button>
        <button onclick="toggleFullscreen()" title="网页内全屏 / 还原" data-fs>全屏</button>
        <span class="sep"></span>
        <button class="layer-btn" data-layer="road" onclick="toggleLayer('road')" title="隐藏 / 显示道路（实线与海上虚线）">道路</button>
        <button class="layer-btn" data-layer="city" onclick="toggleLayer('city')" title="隐藏 / 显示城市（标记与名称）">城市</button>
        <button class="layer-btn" data-layer="terr" onclick="toggleLayer('terr')" title="隐藏 / 显示领地（边界与名称）">领地</button>
        <span class="sep"></span>
        <button onclick="exportPNG()" title="导出完整地图为 PNG（受图层隐藏开关影响，不受缩放 / 全屏影响）">导出</button>
      </span>
      <button class="fold-btn" onclick="toggleTools()" title="折叠工具按钮">»</button>
    </div>
    <svg id="map" viewBox="-500 -500 1000 1000" width="960" height="960"></svg>
  </div>
</div>
</div>
<script>
/* ============================================================

   仅提供本演示页用到的 d3 API 子集，行为与 d3 v4 一致。
   体积：约 4KB；d3.voronoi 由下方 d3-voronoi@1.1.4 单库提供（9KB）。

/* ---- 二叉堆优先队列（复刻 js-priority-queue 的 BinaryHeapStrategy，行为一致）---- */
function PriorityQueue(cfg) {

</script>

<script>
function shuffled(list) {
    var newlist = [];
    for (var i = 0; i < list.length; i++) {
        newlist.push(list[i]);
    }
    for (var i = list.length - 1; i > 0; i--) {
        var tmp = newlist[i];
        var j = randrange(i);
        newlist[i] = newlist[j];
        newlist[j] = tmp;
    }
    return newlist;
}

function choose(list, exponent) {
    exponent = exponent || 1;
    return list[Math.floor(Math.pow(Math.random(), exponent) * list.length)];
}

function randrange(lo, hi) {
    if (hi == undefined) {
        hi = lo;
        lo = 0;
    }
    return Math.floor(Math.random() * (hi - lo)) + lo;
}

function join(list, sep) {
    if (list.length == 0) return '';
    sep = sep || '';
    var s = list[0];
    for (var i = 1; i < list.length; i++) {
        s += sep;
        s += list[i];
    }
    return s;
}

function capitalize(word) {
    return word[0].toUpperCase() + word.slice(1);
}

function spell(lang, syll) {
    if (lang.noortho) return syll;
    var s = '';
    for (var i = 0; i < syll.length; i++) {
        var c = syll[i];
        s += lang.cortho[c] || lang.vortho[c] || defaultOrtho[c] || c;
    }
    return s;
}

function makeSyllable(lang) {
    while (true) {
        var syll = "";
        for (var i = 0; i < lang.structure.length; i++) {
            var ptype = lang.structure[i];
            if (lang.structure[i+1] == '?') {
                i++;
                if (Math.random() < 0.5) {
                    continue;
                }
            }
            syll += choose(lang.phonemes[ptype], lang.exponent);
        }
        var bad = false;
        for (var i = 0; i < lang.restricts.length; i++) {
            if (lang.restricts[i].test(syll)) {
                bad = true;
                break;
            }
        }
        if (bad) continue;
        return spell(lang, syll);
    }
}

function getMorpheme(lang, key) {
    if (lang.nomorph) {
        return makeSyllable(lang);
    }
    key = key || '';
    var list = lang.morphemes[key] || [];
    var extras = 10;
    if (key) extras = 1;
    while (true) {
        var n = randrange(list.length + extras);
        if (list[n]) return list[n];
        var morph = makeSyllable(lang);
        var bad = false;
        for (var k in lang.morphemes) {
            if (lang.morphemes[k].includes(morph)) {
                bad = true;
                break;
            }
        }
        if (bad) continue;
        list.push(morph);
        lang.morphemes[key] = list;
        return morph;
    }
}

function makeWord(lang, key) {
    var nsylls = randrange(lang.minsyll, lang.maxsyll + 1);
    var w = '';
    var keys = [];
    keys[randrange(nsylls)] = key;
    for (var i = 0; i < nsylls; i++) {
        w += getMorpheme(lang, keys[i]);
    }
    return w;
}

function getWord(lang, key) {
    key = key || '';
    var ws = lang.words[key] || [];
    var extras = 3;
    if (key) extras = 2;
    while (true) {
        var n = randrange(ws.length + extras);
        var w = ws[n];
        if (w) {
            return w;
        }
        w = makeWord(lang, key);
        var bad = false;
        for (var k in lang.words) {
            if (lang.words[k].includes(w)) {
                bad = true;
                break;
            }
        }
        if (bad) continue;
        ws.push(w);
        lang.words[key] = ws;
        return w;
    }
}
function makeName(lang, key) {
    key = key || '';
    lang.genitive = lang.genitive || getMorpheme(lang, 'of');
    lang.definite = lang.definite || getMorpheme(lang, 'the');
    while (true) {
        var name = null;
        if (Math.random() < 0.5) {
            name = capitalize(getWord(lang, key));
        } else {
            var w1 = capitalize(getWord(lang, Math.random() < 0.6 ? key : ''));
            var w2 = capitalize(getWord(lang, Math.random() < 0.6 ? key : ''));
            if (w1 == w2) continue;
            if (Math.random() > 0.5) {
                name = join([w1, w2], lang.joiner);
            } else {
                name = join([w1, lang.genitive, w2], lang.joiner);
            }
        }
        if (Math.random() < 0.1) {
            name = join([lang.definite, name], lang.joiner);
        }

        if ((name.length < lang.minchar) || (name.length > lang.maxchar)) continue;
        var used = false;
        for (var i = 0; i < lang.names.length; i++) {
            var name2 = lang.names[i];
            if ((name.indexOf(name2) != -1) || (name2.indexOf(name) != -1)) {
                used = true;
                break;
            }
        }
        if (used) continue;
        lang.names.push(name);
        return name;
    }
}

function makeBasicLanguage() {
    return {
        phonemes: {
            C: "ptkmnls",
            V: "aeiou",
            S: "s",
            F: "mn",
            L: "rl"
        },
        structure: "CVC",
        exponent: 2,
        restricts: [],
        cortho: {},
        vortho: {},
        noortho: true,
        nomorph: true,
        nowordpool: true,
        minsyll: 1,
        maxsyll: 1,
        morphemes: {},
        words: {},
        names: [],
        joiner: ' ',
        maxchar: 12,
        minchar: 5

}

function makeRandomLanguage() {

    lang.noortho = false;
    lang.nomorph = false;
    lang.nowordpool = false;
    lang.phonemes.C = shuffled(choose(consets, 2).C);
    lang.phonemes.V = shuffled(choose(vowsets, 2).V);
    lang.phonemes.L = shuffled(choose(lsets, 2).L);
    lang.phonemes.S = shuffled(choose(ssets, 2).S);
    lang.phonemes.F = shuffled(choose(fsets, 2).F);
    lang.structure = choose(syllstructs);
    lang.restricts = ressets[2].res;
    lang.cortho = choose(corthsets, 2).orth;
    lang.vortho = choose(vorthsets, 2).orth;
    lang.minsyll = randrange(1, 3);

}

function runif(lo, hi) {
    return lo + Math.random() * (hi - lo);

var rnorm = (function () {
    var z2 = null;
    function rnorm() {
        if (z2 != null) {
            var tmp = z2;
            z2 = null;
            return tmp;
        }
        var x1 = 0;
        var x2 = 0;
        var w = 2.0;
        while (w >= 1) {
            x1 = runif(-1, 1);
            x2 = runif(-1, 1);
            w = x1 * x1 + x2 * x2;
        }
        w = Math.sqrt(-2 * Math.log(w) / w);
        z2 = x2 * w;
        return x1 * w;
    }
    return rnorm;
})();

    function trace(src, target) {

        var pq = new PriorityQueue({comparator: function (a, b) {return a.d - b.d;}});
        dist[src] = 0;
        pq.queue({v: src, d: 0});
        while (pq.length) {
            var item = pq.dequeue();
            var u = item.v;
            if (dist[u] !== item.d) continue;
            if (u === target) break;
            var nbs = neighbours(mesh, u);
            for (var j = 0; j < nbs.length; j++) {
                var v = nbs[j];
                var w = distance(mesh, u, v);
                if (h[v] <= 0) w *= 15;                 // 过海重罚：优先陆地，孤岛渡海（虚线显示）
                else if (h[v] > h[u]) w *= 1.2;         // 上坡轻罚（路线更短更直）
                var nd = dist[u] + w;
                if (dist[v] === undefined || nd < dist[v]) { dist[v] = nd; prev[v] = u; pq.queue({v: v, d: nd}); }
            }
        }
        var segs = [], x = target;
        while (x !== undefined && x !== src) {
            var p = prev[x];
            if (p === undefined) return null;
            segs.push([p, x]);                          // 索引对
            x = p;
        }
        return x === src ? segs : null;
    }
    /* 阶段 A：短路径优先 MST（瓶颈限制）——每次接入欧氏距离最近的未接入城市（相邻优先），
       超长连接（> LIMIT）延迟到最后才允许：满足全连通的前提下禁止超长路线
       LIMIT 动态自适应：城市对欧氏距离 60 分位 × 1.3（随种子城市分布变化）*/
    function euclid(a, b) { var dx = a[0] - b[0], dy = a[1] - b[1]; return Math.sqrt(dx * dx + dy * dy); }
    var pairDists = [];
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) pairDists.push(euclid(mesh.vxs[cities[i]], mesh.vxs[cities[j]]));
    pairDists.sort(function (a, b) { return a - b; });
    var LIMIT = Math.min(pairDists[Math.floor(pairDists.length * 0.6)] * 1.3, 0.38);   // 超长阈值：动态自适应 + 硬上限 0.38 世界（≈380 viewBox）
    var inTreeCity = {}; inTreeCity[0] = true;      // cities 数组下标是否已接入
    var connected = 1;
    var tried = {};                                 // 本次尝试过但超长的城市（延迟）
    function pathLen(segs) {
        var L = 0;
        for (var i = 0; i < segs.length; i++) L += euclid(mesh.vxs[segs[i][0]], mesh.vxs[segs[i][1]]);
        return L;
    }
    var guard = 0;
    while (connected < n && guard++ < n * 8) {
        var best = -1, bestD = Infinity;            // 欧氏距离最近的未接入城市
        for (var i = 0; i < n; i++) {
            if (inTreeCity[i] || tried[i]) continue;
            var dMin = Infinity;
            for (var j = 0; j < n; j++) {
                if (!inTreeCity[j]) continue;
                var dd = euclid(mesh.vxs[cities[i]], mesh.vxs[cities[j]]);
                if (dd < dMin) dMin = dd;
            }
            if (dMin < bestD) { bestD = dMin; best = i; }
        }
        if (best < 0) { tried = {}; continue; }     // 全部被延迟 → 解除限制（兜底长连接）
        var nearJ = -1, nearD = Infinity;           // 距 best 最近的已接入城市
        for (var j = 0; j < n; j++) {
            if (!inTreeCity[j]) continue;
            var dd = euclid(mesh.vxs[cities[best]], mesh.vxs[cities[j]]);
            if (dd < nearD) { nearD = dd; nearJ = j; }
        }
        var segs = trace(cities[nearJ], cities[best]);
        if (segs && pathLen(segs) <= LIMIT) {       // 短路径 → 接入
            for (var k = segs.length - 1; k >= 0; k--) addEdge(segs[k][0], segs[k][1]);
            inTreeCity[best] = true;
            connected++;
        } else { tried[best] = true; }              // 超长或 trace 失败 → 延迟到最后
    }
    /* 兜底：仍无法接入 → 沿地形 trace 连最近已入树城市（超长允许但绝不直线；trace 真失败才直线，极罕见）*/
    for (var i = 0; i < n; i++) {
        if (inTreeCity[i]) continue;
        var best2 = -1, bestd2 = Infinity;
        for (var j = 0; j < n; j++) {
            if (!inTreeCity[j]) continue;
            var dd = euclid(mesh.vxs[cities[i]], mesh.vxs[cities[j]]);
            if (dd < bestd2) { bestd2 = dd; best2 = j; }   // best2 存城市索引
        }
        if (best2 >= 0) {
            var segs = trace(cities[best2], cities[i]);    // 沿地形（可绕海绕山，非直线）
            if (segs) { for (var k = segs.length - 1; k >= 0; k--) addEdge(segs[k][0], segs[k][1]); }
            else { addEdge(cities[i], cities[best2]); }    // 真正不可达才直线（几乎不发生）
            inTreeCity[i] = true;
        }
    }
    /* 阶段 B：补充 城镇→领地首都 直达（连接倾向次高；与 MST 重复的边自动去重）*/
    for (var i = nterrs; i < n; i++) {
        var town = cities[i], cap = terr[town];
        if (cap === undefined || cap === town) continue;
        var segs = trace(cap, town);
        if (segs) { for (var k = segs.length - 1; k >= 0; k--) addEdge(segs[k][0], segs[k][1]); }
    }
    return {
        land: mergeSegments(landRoads).map(relaxPath),   // 陆地道路：实线
        sea: mergeSegments(seaRoads).map(relaxPath)      // 海上道路：虚线
    };
}
function getTerritories(render) {
    var h = render.h;
    var cities = render.cities;
    var n = render.params.nterrs;
    if (n > render.cities.length) n = render.cities.length;
    var flux = getFlux(h);
    var terr = [];
    var queue = new PriorityQueue({comparator: function (a, b) {return a.score - b.score}});
    function weight(u, v) {
        var horiz = distance(h.mesh, u, v);
        var vert = h[v] - h[u];
        if (vert > 0) vert /= 10;
        var diff = 1 + 0.25 * Math.pow(vert/horiz, 2);
        diff += 100 * Math.sqrt(flux[u]);
        if (h[u] <= 0) diff = 100;
        if ((h[u] > 0) != (h[v] > 0)) return 1000;
        return horiz * diff;
    }
    for (var i = 0; i < n; i++) {
        terr[cities[i]] = cities[i];
        var nbs = neighbours(h.mesh, cities[i]);
        for (var j = 0; j < nbs.length; j++) {
            queue.queue({
                score: weight(cities[i], nbs[j]),
                city: cities[i],
                vx: nbs[j]
            });
        }
    }
    while (queue.length) {
        var u = queue.dequeue();
        if (terr[u.vx] != undefined) continue;
        terr[u.vx] = u.city;
        var nbs = neighbours(h.mesh, u.vx);
        for (var i = 0; i < nbs.length; i++) {
            var v = nbs[i];
            if (terr[v] != undefined) continue;
            var newdist = weight(u.vx, v);
            queue.queue({
                score: u.score + newdist,
                city: u.city,
                vx: v
            });
        }
    }
    terr.mesh = h.mesh;
    return terr;
}

function getBorders(render) {
    var terr = render.terr;
    var h = render.h;
    var edges = [];
    for (var i = 0; i < terr.mesh.edges.length; i++) {
        var e = terr.mesh.edges[i];
        if (e[3] == undefined) continue;
        if (isnearedge(terr.mesh, e[0]) || isnearedge(terr.mesh, e[1])) continue;
        if (h[e[0]] < 0 || h[e[1]] < 0) continue;
        if (terr[e[0]] != terr[e[1]]) {
            edges.push([e[2], e[3]]);
        }
    }
    return mergeSegments(edges).map(relaxPath);
}

function mergeSegments(segs) {
    var adj = {};
    for (var i = 0; i < segs.length; i++) {
        var seg = segs[i];
        var a0 = adj[seg[0]] || [];
        var a1 = adj[seg[1]] || [];
        a0.push(seg[1]);
        a1.push(seg[0]);
        adj[seg[0]] = a0;
        adj[seg[1]] = a1;
    }
    var done = [];
    var paths = [];
    var path = null;
    while (true) {
        if (path == null) {
            for (var i = 0; i < segs.length; i++) {
                if (done[i]) continue;
                done[i] = true;
                path = [segs[i][0], segs[i][1]];
                break;
            }
            if (path == null) break;
        }
        var changed = false;
        for (var i = 0; i < segs.length; i++) {
            if (done[i]) continue;
            if (adj[path[0]].length == 2 && segs[i][0] == path[0]) {
                path.unshift(segs[i][1]);
            } else if (adj[path[0]].length == 2 && segs[i][1] == path[0]) {
                path.unshift(segs[i][0]);
            } else if (adj[path[path.length - 1]].length == 2 && segs[i][0] == path[path.length - 1]) {
                path.push(segs[i][1]);
            } else if (adj[path[path.length - 1]].length == 2 && segs[i][1] == path[path.length - 1]) {
                path.push(segs[i][0]);
            } else {
                continue;
            }
            done[i] = true;
            changed = true;
            break;
        }
        if (!changed) {
            paths.push(path);
            path = null;
        }
    }
    return paths;
}

function relaxPath(path) {
    var newpath = [path[0]];
    for (var i = 1; i < path.length - 1; i++) {
        var newpt = [0.25 * path[i-1][0] + 0.5 * path[i][0] + 0.25 * path[i+1][0],
                     0.25 * path[i-1][1] + 0.5 * path[i][1] + 0.25 * path[i+1][1]];
        newpath.push(newpt);
    }
    newpath.push(path[path.length - 1]);
    return newpath;
}

function visualizeSlopes(svg, render) {
    var h = render.h;
    var strokes = [];
    var r = 0.25 / Math.sqrt(h.length);
    for (var i = 0; i < h.length; i++) {
        if (h[i] <= 0 || isnearedge(h.mesh, i)) continue;
        var nbs = neighbours(h.mesh, i);
        nbs.push(i);
        var s = 0;
        var s2 = 0;
        for (var j = 0; j < nbs.length; j++) {
            var slopes = trislope(h, nbs[j]);
            s += slopes[0] / 10;
            s2 += slopes[1];
        }
        s /= nbs.length;
        s2 /= nbs.length;
        if (Math.abs(s) < runif(0.1, 0.4)) continue;
        var l = r * runif(1, 2) * (1 - 0.2 * Math.pow(Math.atan(s), 2)) * Math.exp(s2/100);
        var x = h.mesh.vxs[i][0];
        var y = h.mesh.vxs[i][1];
        if (Math.abs(l*s) > 2 * r) {
            var n = Math.floor(Math.abs(l*s/r));
            l /= n;
            if (n > 4) n = 4;
            for (var j = 0; j < n; j++) {
                var u = rnorm() * r;
                var v = rnorm() * r;
                strokes.push([[x+u-l, y+v+l*s], [x+u+l, y+v-l*s]]);
            }
        } else {
            strokes.push([[x-l, y+l*s], [x+l, y-l*s]]);
        }
    }
    var lines = svg.selectAll('line.slope').data(strokes)
    lines.enter()
            .append('line')
            .classed('slope', true);
    lines.exit()
            .remove();
    svg.selectAll('line.slope')
        .attr('x1', function (d) {return 1000*d[0][0]})
        .attr('y1', function (d) {return 1000*d[0][1]})
        .attr('x2', function (d) {return 1000*d[1][0]})
        .attr('y2', function (d) {return 1000*d[1][1]})
}


function visualizeCities(svg, render) {

}

function generateCoast(params) {
    var mesh = generateGoodMesh(params.npts, params.extent);
    var h = add(
            slope(mesh, randomVector(4)),
            cone(mesh, runif(-1, -1)),
            mountains(mesh, 50)
            );
    for (var i = 0; i < 10; i++) {
        h = relax(h);
    }
    h = peaky(h);
    h = doErosion(h, runif(0, 0.1), 5);
    h = setSeaLevel(h, runif(0.2, 0.6));
    h = fillSinks(h);
    h = cleanCoast(h, 3);
    return h;
}

function terrCenter(h, terr, city, landOnly) {
    var x = 0;
    var y = 0;
    var n = 0;
    for (var i = 0; i < terr.length; i++) {
        if (terr[i] != city) continue;
        if (landOnly && h[i] <= 0) continue;
        x += terr.mesh.vxs[i][0];
        y += terr.mesh.vxs[i][1];
        n++;
    }
    return [x/n, y/n];
}

/* ============ 通用词库系统：地形分类 + 词库注册表 ============
   地形标签（通用，与词库无关）：
     城市 {coast 临海, wet 近河/湖}  领地 {flat 平坦, dry 干燥河流少, wet 河流多}
   词库对象按地形标签提供名字部件池 → 新增词库只需在 LEXICONS 加条目，
   即可复用同一套地形分类与生成逻辑（不再是 DND 词库的专用代码）。
   =============================================================== */
var zhUsed = [];

  if (name.length < 2 || name.length > 4) return false;
  for (var i = 0; i < zhUsed.length; i++) {
    var u = zhUsed[i];
    if (u.indexOf(name) !== -1 || name.indexOf(u) !== -1) return false;
  }
  zhUsed.push(name);
  return true;
}
/* 地形分类（通用）：为所有城市/领地计算地形标签 */
function classifyTerrains(render) {
  var h = render.h, terrArr = render.terr;
  var cities = render.cities;
  var nterrs = Math.min(render.params.nterrs, cities.length);
  var riverPts = [];
  for (var i = 0; i < render.rivers.length; i++) {
    var rp = render.rivers[i];
    for (var j = 0; j < rp.length; j++) riverPts.push(rp[j]);
  }
  var cityTerr = [];
  for (var i = 0; i < cities.length; i++) {
    var cvx = cities[i], coast = false;
    var nbs = neighbours(h.mesh, cvx);
    for (var j = 0; j < nbs.length; j++) if (h[nbs[j]] <= 0) { coast = true; break; }
    var p = h.mesh.vxs[cvx], wet = coast;               // 临海即水域；否则看近河
    if (!wet) {
      for (var k = 0; k < riverPts.length; k++) {
        var dx = riverPts[k][0] - p[0], dy = riverPts[k][1] - p[1];
        if (dx * dx + dy * dy < 0.0016) { wet = true; break; }   // 0.04 世界 ≈ 40px
      }
    }
    cityTerr.push({coast: coast, wet: wet});
  }
  var regionTerr = [];
  for (var i = 0; i < nterrs; i++) {
    var cap = cities[i];
    var ssum = 0, cnt = 0;
    for (var j = 0; j < h.length; j++) if (terrArr[j] === cap) { ssum += h[j]; cnt++; }
    var mean = cnt ? ssum / cnt : 0;
    var vsum = 0;
    for (var j = 0; j < h.length; j++) if (terrArr[j] === cap) { var d = h[j] - mean; vsum += d * d; }
    var varr = cnt ? vsum / cnt : 0;
    var lc = terrCenter(h, terrArr, cap, true);
    var wetCnt = 0;
    for (var k = 0; k < riverPts.length; k++) {
      var dx = riverPts[k][0] - lc[0], dy = riverPts[k][1] - lc[1];
      if (dx * dx + dy * dy < 0.0036) wetCnt++;
    }
    regionTerr.push({flat: varr < 0.006, dry: wetCnt <= 2, wet: wetCnt > 2});
  }
  return {cities: cityTerr, regions: regionTerr};
}
/* 通用中文名生成器：lex=词库对象（提供部件池），terr=地形标签 */
function makeNameZh(key, lex, terr) {
  terr = terr || {};
  var sfx1 = (key === 'region') ? (terr.flat ? lex.regionSfx1.flat : lex.regionSfx1.hill) : '';
  var sfx2 = '';
  if (key === 'region') {
    if (terr.dry) sfx2 = lex.regionSfx2.dry;
    else if (terr.flat) sfx2 = lex.regionSfx2.flat;
    else sfx2 = lex.regionSfx2.hill;
  }
  var citySfx = (key === 'city') ? (terr.coast ? lex.citySfx.coast : (terr.wet ? lex.citySfx.wet : lex.citySfx.inland)) : '';
  for (var t = 0; t < 800; t++) {
    var m1 = zhPick(lex.m1), m2 = zhPick(lex.m2);
    var name;
    if (key === 'region') {
      var r = Math.random();
      if (r < 0.25) name = m1 + m2 + '之' + zhPick(sfx1);
      else if (r < 0.55) name = m1 + m2 + zhPick(sfx1);
      else name = m1 + m2 + zhPickWord(sfx2);
    } else {
      var r = Math.random();
      if (r < 0.08) name = m1 + zhPick(citySfx);
      else if (r < 0.28) name = m1 + m2 + '之' + zhPick(citySfx);
      else if (r < 0.96) name = m1 + m2 + zhPick(citySfx);
      else name = m1 + m2;
    }
    if (zhOk(name)) return name;
  }
  return '无名地' + (zhUsed.length + 1);
}

            for (var j = 0; j < avoid.length; j++) {
                var avpath = avoid[j];
                for (var k = 0; k < avpath.length; k++) {
                    var pt = avpath[k];
                    if (pt[0] > label.x0 && pt[0] < label.x1 && pt[1] > label.y0 && pt[1] < label.y1) {
                        pen++;
                    }
                }
            }
        }
        return pen;
    }
    for (var i = 0; i < cities.length; i++) {
        var x = h.mesh.vxs[cities[i]][0];
        var y = h.mesh.vxs[cities[i]][1];
        var textEn = cityTextsEn[i];
        var textZh = cityTextsZh[i];
        var size = i < nterrs ? params.fontsizes.city : params.fontsizes.town;
        var sx = 0.65 * size/1000 * Math.max(textEn.length, 1.7 * textZh.length);
        var sy = size/1000;
        var posslabels = [
        {
            x: x + 0.8 * sy,
            y: y + 0.3 * sy,
            align: 'start',
            x0: x + 0.7 * sy,
            y0: y - 0.6 * sy,
            x1: x + 0.7 * sy + sx,
            y1: y + 0.6 * sy
        },
        {
            x: x - 0.8 * sy,
            y: y + 0.3 * sy,
            align: 'end',
            x0: x - 0.9 * sy - sx,
            y0: y - 0.7 * sy,
            x1: x - 0.9 * sy,
            y1: y + 0.7 * sy
        },
        {
            x: x,
            y: y - 0.8 * sy,
            align: 'middle',
            x0: x - sx/2,
            y0: y - 1.9*sy,
            x1: x + sx/2,
            y1: y - 0.7 * sy
        },
        {
            x: x,
            y: y + 1.2 * sy,
            align: 'middle',
            x0: x - sx/2,
            y0: y + 0.1*sy,
            x1: x + sx/2,
            y1: y + 1.3*sy
        }
        ];
        var label = posslabels[d3.scan(posslabels, function (a, b) {return penalty(a) - penalty(b)})];
        label.text = textEn;
        label.textZh = textZh;
        label.size = size;
        citylabels.push(label);
    }
    var texts = svg.selectAll('text.city').data(citylabels);
    texts.enter()
        .append('text')
        .classed('city', true);
    texts.exit()
        .remove();
    svg.selectAll('text.city')
        .attr('x', function (d) {return 1000*d.x})
        .attr('y', function (d) {return 1000*d.y})
        .style('font-size', function (d) {return d.size})
        .style('text-anchor', function (d) {return d.align})
        .classed('dnd', currentLex !== 'orig')
        .text(function (d) {return currentLex !== 'orig' ? d.textZh : d.text})
        .raise();

    var reglabels = [];
    for (var i = 0; i < nterrs; i++) {
        var city = cities[i];
        var textEn = regionTextsEn[i];
        var textZh = regionTextsZh[i];
        var sy = params.fontsizes.region / 1000;
        var sx = 0.6 * Math.max(textEn.length, 1.7 * textZh.length) * sy;
        var lc = terrCenter(h, terr, city, true);
        var oc = terrCenter(h, terr, city, false);
        var best = 0;
        var bestscore = -999999;
        for (var j = 0; j < h.length; j++) {
            var score = 0;
            var v = h.mesh.vxs[j];
            score -= 3000 * Math.sqrt((v[0] - lc[0]) * (v[0] - lc[0]) + (v[1] - lc[1]) * (v[1] - lc[1]));
            score -= 1000 * Math.sqrt((v[0] - oc[0]) * (v[0] - oc[0]) + (v[1] - oc[1]) * (v[1] - oc[1]));
            if (terr[j] != city) score -= 3000;
            for (var k = 0; k < cities.length; k++) {
                var u = h.mesh.vxs[cities[k]];
                if (Math.abs(v[0] - u[0]) < sx && 
                    Math.abs(v[1] - sy/2 - u[1]) < sy) {
                    score -= k < nterrs ? 4000 : 500;
                }
                if (v[0] - sx/2 < citylabels[k].x1 &&
                    v[0] + sx/2 > citylabels[k].x0 &&
                    v[1] - sy < citylabels[k].y1 &&
                    v[1] > citylabels[k].y0) {
                    score -= 5000;
                }
            }
            for (var k = 0; k < reglabels.length; k++) {
                var label = reglabels[k];
                if (v[0] - sx/2 < label.x + label.width/2 &&
                    v[0] + sx/2 > label.x - label.width/2 &&
                    v[1] - sy < label.y &&
                    v[1] > label.y - label.size) {
                    score -= 20000;
                }
            }
            if (h[j] <= 0) score -= 500;
            if (v[0] + sx/2 > 0.5 * h.mesh.extent.width) score -= 50000;
            if (v[0] - sx/2 < -0.5 * h.mesh.extent.width) score -= 50000;
            if (v[1] > 0.5 * h.mesh.extent.height) score -= 50000;
            if (v[1] - sy < -0.5 * h.mesh.extent.height) score -= 50000;
            if (score > bestscore) {
                bestscore = score;
                best = j;
            }
        }
        reglabels.push({
            text: textEn,
            textZh: textZh, 
            x: h.mesh.vxs[best][0], 
            y: h.mesh.vxs[best][1], 
            size:sy, 
            width:sx
        });
    }
    texts = svg.selectAll('text.region').data(reglabels);
    texts.enter()
        .append('text')
        .classed('region', true);
    texts.exit()
        .remove();
    svg.selectAll('text.region')
        .attr('x', function (d) {return 1000*d.x})
        .attr('y', function (d) {return 1000*d.y})
        .style('font-size', function (d) {return 1000*d.size})
        .style('text-anchor', 'middle')
        .classed('dnd', currentLex !== 'orig')
        .text(function (d) {return currentLex !== 'orig' ? d.textZh : d.text})
        .raise();

}
function drawMap(svg, render) {
    render.rivers = getRivers(render.h, 0.01);
    render.coasts = contour(render.h, 0);
    render.terr = getTerritories(render);
    render.borders = getBorders(render);
    render.roads = getRoads(render);                 // 需要 render.terr：{land: 陆地道路, sea: 海上道路}
    render.landRoads = render.roads.land;
    render.seaRoads = render.roads.sea;
    drawPaths(svg, 'river', render.rivers);
    drawPaths(svg, 'coast', render.coasts);
    drawPaths(svg, 'border', render.borders);
    drawPaths(svg, 'road', render.landRoads);         // 陆地道路：实线
    drawPaths(svg, 'roadsea', render.seaRoads);       // 海上道路：虚线
    visualizeSlopes(svg, render);                 // 山脉影线
    visualizeCities(svg, render);
    drawLabels(svg, render);
}

function doMap(svg, params) {
    var render = {
        params: params
    };
    var width = svg.attr('width');
    svg.attr('height', width * params.extent.height / params.extent.width);
    svg.attr('viewBox', -1000 * params.extent.width/2 + ' ' + 
                        -1000 * params.extent.height/2 + ' ' + 
                        1000 * params.extent.width + ' ' + 
                        1000 * params.extent.height);
    svg.selectAll().remove();
    render.h = params.generator(params);
    placeCities(render);
    drawMap(svg, render);
}

var defaultParams = {
    extent: defaultExtent,
    generator: generateCoast,
    npts: 16384,
    ncities: 15,
    nterrs: 5,
    fontsizes: {
        region: 40,
        city: 25,
        town: 20
    }
}



</script>
<script>
/* 页面控制：种子化随机 + 生成 */
function hashStr(s) {
  var h = 1779033703 ^ s.length;
  for (var i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var svg = d3.select('#map');
var EXTERNAL_LEXES = [];  // 运行时从 lexicons/index.js 读取词库清单（加词库无需改 HTML）
/* 词库切换：orig = 原版随机音素名（内置），其余 = 外部词库（lexicons 文件夹，运行时加载）*/ 
var currentLex = 'orig';
function setLex(v) {
  currentLex = LEXICONS[v] ? v : 'orig';
  var zh = currentLex !== 'orig';
  d3.selectAll('text.city').classed('dnd', zh).text(function (d) {return zh ? d.textZh : d.text;});
  d3.selectAll('text.region').classed('dnd', zh).text(function (d) {return zh ? d.textZh : d.text;});
}
/* 词库下拉动态生成（按运行时已加载的词库）*/
function buildLexSelect() {
  var sel = document.getElementById('lexsel');
  if (!sel) return;
  sel.innerHTML = '';
  var items = [['orig', '原版']];
  for (var id in LEXICONS) items.push([id, LEXICONS[id].label || id]);
  for (var i = 0; i < items.length; i++) {
    var o = document.createElement('option');
    o.value = items[i][0]; o.textContent = items[i][1];
    if (items[i][0] === currentLex) o.selected = true;
    sel.appendChild(o);
  }
}
/* 词库异步加载：动态 <script src> 加载 lexicons/lex-<id>.js（file:// 下 script 不受 CORS 限制）
   清单来自 lexicons/index.js（window.LEX_MANIFEST）；缺失/失败 → 自动回退原版，绝不报错 */
function __loadLexes(list) {
  EXTERNAL_LEXES = list || [];
  var pending = EXTERNAL_LEXES.length;
  function done() {
    if (--pending > 0) return;
    if (!LEXICONS[currentLex]) currentLex = 'orig';
    buildLexSelect();
    gen();
  }
  if (!EXTERNAL_LEXES.length) { buildLexSelect(); gen(); return; }
  for (var i = 0; i < EXTERNAL_LEXES.length; i++) {
    (function (id) {
      var s = document.createElement('script');
      s.src = 'lexicons/lex-' + id + '.js';
      s.onload = s.onerror = function () {
        if (window.LEX_DEFS && window.LEX_DEFS[id]) LEXICONS[id] = window.LEX_DEFS[id];
        done();
      };
      document.head.appendChild(s);
    })(EXTERNAL_LEXES[i]);
  }
}
(function () {
  var m = location.search.match(/[?&]lex=([a-z]+)/);
  if (m) currentLex = m[1];
})();
/* 先加载词库清单 index.js，再按清单加载各词库 */
var __ms = document.createElement('script');
__ms.src = 'lexicons/index.js';
__ms.onload = function () { __loadLexes(window.LEX_MANIFEST || []); };
__ms.onerror = function () { __loadLexes([]); };
document.head.appendChild(__ms);
/* 随机种子：只填入随机数字种子，不立即生成（生成交给「生成地图」按钮） */
function randomSeed() {
  var seed = Math.floor(Math.random() * 1e9) >>> 0;
  document.getElementById('seed').value = seed;
  document.getElementById('status').textContent = '随机种子已填入：' + seed + '（点「生成地图」生成）';
}
/* ---- 地图缩放（viewBox 动态控制：滚轮缩放 + 拖拽平移 + 双击复位 + 按钮组）---- */
var vb = { x: -500, y: -500, w: 1000, h: 1000 };
var VB_MIN_W = 1000 / 8; // 最大放大 8 倍
var mapEl = document.getElementById('map');
function applyVB() { mapEl.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h); }
function clampVB() {
  if (vb.w < VB_MIN_W) { var k = VB_MIN_W / vb.w; vb.w = VB_MIN_W; vb.h *= k; }
  if (vb.w > 1000) { var k = 1000 / vb.w; vb.w = 1000; vb.h *= k; }
  var maxX = -500 + 1000 - vb.w, maxY = -500 + 1000 - vb.h;
  if (vb.x < -500) vb.x = -500; if (vb.x > maxX) vb.x = maxX;
  if (vb.y < -500) vb.y = -500; if (vb.y > maxY) vb.y = maxY;
}
function zoomAt(cx, cy, factor) {
  vb.w *= factor; vb.h *= factor;
  vb.x = cx - (cx - vb.x) * factor; vb.y = cy - (cy - vb.y) * factor;
  clampVB(); applyVB();
}
function zoomBy(f) { zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, f); }
function resetView() { vb = { x: -500, y: -500, w: 1000, h: 1000 }; applyVB(); }
mapEl.addEventListener('wheel', function (e) {
  e.preventDefault();
  var r = mapEl.getBoundingClientRect();
  var cx = vb.x + (e.clientX - r.left) / r.width * vb.w;
  var cy = vb.y + (e.clientY - r.top) / r.height * vb.h;
  zoomAt(cx, cy, e.deltaY > 0 ? 1.2 : 1 / 1.2);
}, { passive: false });
var drag = null;
mapEl.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  drag = { sx: e.clientX, sy: e.clientY, bx: vb.x, by: vb.y };
  mapEl.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', function (e) {
  if (!drag) return;
  var r = mapEl.getBoundingClientRect();
  vb.x = drag.bx - (e.clientX - drag.sx) / r.width * vb.w;
  vb.y = drag.by - (e.clientY - drag.sy) / r.height * vb.h;
  clampVB(); applyVB();
});
window.addEventListener('mouseup', function () {
  if (drag) { drag = null; mapEl.classList.remove('dragging'); }
});
mapEl.addEventListener('dblclick', resetView);
/* ---- 地图自适应视口：svg 保持正方形，尺寸 = min(容器宽, 视口剩余高) ---- */
function fitSvg() {
  var box = document.querySelector('.mapbox');
  var top = box.getBoundingClientRect().top; // mapbox 顶部到视口顶（含头部与 body padding）
  var availW = window.innerWidth - 48; // body padding 24*2，地图可用的视口宽度
  var availH = window.innerHeight - top - 44; // 44 = mapbox padding 20 + body 底部 padding 24
  var s = Math.min(960, availW, availH);
  if (s < 200) s = 200;
  mapEl.style.width = s + 'px';
  mapEl.style.height = s + 'px';
}
window.addEventListener('resize', function () {
  if (document.querySelector('.mapbox').classList.contains('fullscreen')) applyFsSize();
  else fitSvg();
});
fitSvg();
/* ---- 网页内全屏：mapbox 放大占满整个网页（再点还原），非浏览器全屏 ---- */
function applyFsSize() {
  // 全屏时 svg 放大到视口允许的最大正方形（与 CSS max-width/max-height 一致）
  var s = Math.min(window.innerWidth * 0.96, window.innerHeight * 0.94);
  mapEl.style.width = s + 'px';
  mapEl.style.height = s + 'px';
}
function toggleFullscreen() {
  var mb = document.querySelector('.mapbox');
  var isFs = mb.classList.toggle('fullscreen');
  var b = document.querySelector('.map-tools button[data-fs]');
  if (b) b.textContent = isFs ? '还原' : '全屏';
  if (isFs) { resetView(); applyFsSize(); }
  else fitSvg();
}
/* ---- 图层显隐开关：道路 / 城市 / 领地（标记与文字一起隐藏）----
   切换式按钮：点击一次隐藏、再点恢复；隐藏时按钮高亮。
   layerState[k]=true 表示该层当前被隐藏；生成新地图后自动重新应用。 */
var layerState = { road: false, city: false, terr: false };
var layerSelectors = {
  road: 'path.road, path.roadsea',   // 陆地道路（实线）+ 海上道路（虚线）
  city: 'circle.city, text.city',    // 城市圆点 + 城市名称
  terr: 'path.border, text.region'   // 领地边界 + 领地名称
};
function applyLayers() {
  for (var k in layerState) {
    d3.selectAll(layerSelectors[k]).classed('layer-hidden', layerState[k]);
    var btn = document.querySelector('.map-tools button[data-layer="' + k + '"]');
    if (btn) btn.classList.toggle('active', layerState[k]);
  }
}
function toggleLayer(k) {
  if (!(k in layerState)) return;
  layerState[k] = !layerState[k];
  applyLayers();
}
/* ---- 工具条折叠 / 展开：按钮组向右侧收起，只留右侧的小按钮 ---- */
function toggleTools() {
  var mt = document.querySelector('.map-tools');
  if (!mt) return;
  var collapsed = mt.classList.toggle('collapsed');
  var b = mt.querySelector('.fold-btn');
  if (b) {
    b.textContent = collapsed ? '«' : '»';
    b.title = collapsed ? '展开工具按钮' : '折叠工具按钮';
  }
}
/* ---- 导出当前地图为 PNG 图片 ----
   特性：
   1) 受图层隐藏开关影响：克隆 SVG 时保留 layer-hidden class，注入页面样式后 display:none 规则同步生效；
   2) 不受缩放 / 全屏影响：始终用生成时的完整 viewBox 导出（缩放按钮会改写 svg 的 viewBox，这里显式覆盖），
      分辨率 = 完整地图 x2（1000 → 2000px，可调 scale）。 */
function exportPNG() {
  var map = document.getElementById('map');
  if (!map || map.childNodes.length === 0) {
    document.getElementById('status').textContent = '请先点「生成地图」，再导出图片';
    return;
  }
  var status = document.getElementById('status');
  status.textContent = '正在导出图片…';
  var ex = defaultParams.extent;                              // extent 恒为 1x1，此处按生成逻辑通用计算
  var fullVB = (-1000 * ex.width / 2) + ' ' + (-1000 * ex.height / 2) + ' ' +
               (1000 * ex.width) + ' ' + (1000 * ex.height);  // -500 -500 1000 1000
  var scale = 2;                                              // 导出分辨率倍率
  var cw = Math.round(1000 * ex.width * scale);
  var ch = Math.round(1000 * ex.height * scale);
  /* 克隆 SVG（保留 id 与图层 class，隐藏状态随样式注入生效），注入页面全部样式 */
  var clone = map.cloneNode(true);
  clone.setAttribute('viewBox', fullVB);
  var styles = [];
  var sels = document.querySelectorAll('style');
  for (var i = 0; i < sels.length; i++) styles.push(sels[i].textContent);
  styles.push('svg#map{width:' + cw + 'px!important;height:' + ch + 'px!important;' +
              'max-width:none!important;max-height:none!important;display:block;}');
  var st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  st.textContent = styles.join('\n');
  clone.insertBefore(st, clone.firstChild);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  var xml = new XMLSerializer().serializeToString(clone);
  var img = new Image();
  img.onload = function () {
    var canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f5ecd7';                                // 羊皮纸底色（与页面一致）
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    canvas.toBlob(function (blob) {
      var seedTxt = document.getElementById('seed').value.trim();
      var fname = '程序化大陆-种子' + (seedTxt || '随机') + '.png';
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      status.textContent = '图片已导出：' + fname + '（' + cw + '×' + ch + 'px）';
    }, 'image/png');
  };
  img.onerror = function () {
    status.textContent = '导出失败：SVG 渲染出错';
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}
function gen() {
  var seedTxt = document.getElementById('seed').value.trim();
  var seed;
  if (/^\d+$/.test(seedTxt)) {
    seed = parseInt(seedTxt, 10) >>> 0;              // 数字种子：直接使用，不哈希 —— 输入框值 = 地图种子 = 状态栏显示，生成按钮不改动输入框
  } else if (seedTxt) {
    seed = hashStr(seedTxt);                         // 文字种子：哈希后使用（原版行为，仍可复现）
  } else {
    seed = (Math.floor(Math.random() * 1e9) >>> 0);  // 空种子：随机生成并填入输入框
    document.getElementById('seed').value = seed;
  }
  Math.random = mulberry32(seed);
  var params = Object.assign({}, defaultParams);
  params.npts = parseInt(document.getElementById('npts').value, 10);
  params.ncities = parseInt(document.getElementById('ncities').value, 10) || 15;
  params.nterrs = Math.min(parseInt(document.getElementById('nterrs').value, 10) || 5, params.ncities);
  var status = document.getElementById('status');
  status.textContent = '生成中…（' + params.npts.toLocaleString() + ' 细胞 · 种子 ' + seed + '）';
  setTimeout(function () {
    var t0 = Date.now();
    try {
      doMap(svg, params);
      applyLayers();   // 重新生成后应用当前的隐藏设置（svg 已被清空重建）
      status.textContent = '完成 · 用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's · 种子 ' + seed + '（同种子可复现）';
    } catch (e) {
      status.textContent = '生成出错: ' + e.message;
      console.error(e);
    }
  }, 30);
}
